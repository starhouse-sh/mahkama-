<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>رولات القضاة - كشف القضايا الجديدة - نفس ترتيب الجلسات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma}
body{background:#fff;direction:rtl;padding:4px;height:100vh;display:flex;flex-direction:column}
header{background:#0f1f3a;color:#FFD700;padding:8px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.btn{padding:7px 10px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:11px}
.btn-navy{background:#0A2342;color:#fff}.btn-gold{background:#C9A227;color:#000}.btn-green{background:#0a7a42;color:#fff}.btn-dark{background:#333;color:#fff}
.btn-day{background:#eef2ff;border:1.5px solid #0A2342;color:#0A2342;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:bold;margin:3px;cursor:pointer}
.btn-day.active{background:#0A2342;color:#fff}
.btn-type{background:#fff;border:1.5px solid #0a7a42;color:#0a7a42;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:bold;margin:3px;cursor:pointer}
.btn-type.active{background:#0a7a42;color:#fff}
.btn-type-new{background:#fff;border:1.5px solid #b00020;color:#b00020;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:bold;margin:3px;cursor:pointer}
.btn-type-new.active{background:#b00020;color:#fff}
.input{padding:6px;border:1.5px solid #888;border-radius:6px;font-weight:bold}
.filter-bar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;padding:8px;background:#f8f9fa;border-radius:8px;border:1px solid #ddd}
.date-bar{display:flex;gap:4px;flex-wrap:wrap;padding:6px;background:#fffbe6;border:1px dashed #C9A227;border-radius:8px;margin-top:6px;min-height:36px}
.main-split{display:grid;grid-template-columns:340px 1fr;gap:8px;flex:1;overflow:hidden;margin-top:6px;direction:rtl}
.list-wrap{background:#fff;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;border:1.5px solid #0A2342}
.list-head{background:#0A2342;color:#fff;padding:6px;text-align:center;font-weight:bold;font-size:11px}
.list-body{flex:1;overflow:auto}
.list-item{padding:8px 6px;border-bottom:1px solid #ddd;cursor:pointer}
.list-item.active{background:#0A2342;color:#fff}
.detail-wrap{background:#fff;padding:10px 15px;overflow:auto}
.raqm{font-size:22px;font-weight:bold;text-align:center;padding:12px 0 20px 0;color:#000}
.most{font-size:21px;text-align:right;padding:2px 0;line-height:1.7;color:#000}
.most div{padding:3px 0;border-bottom:1px dashed #eee}
.row-vs{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.vs{font-size:20px;font-weight:bold;color:#000}
.noa{font-size:18px;color:#000}
</style>
</head>
<body>
<header><div>📋 رولات القضاة - نفس ترتيب الجلسات ✅</div><div id="log" style="font-size:10px;background:#fff;color:#0A2342;padding:3px 7px;border-radius:5px">جاري تحميل...</div></header>

<div class="filter-bar">
<div><b>الشهر</b><br><select id="selMonth" class="input" style="width:120px"></select></div>
<div><b>السنة</b><br><input id="selYear" type="number" class="input" style="width:80px"></div>
<button class="btn btn-navy" onclick="doSearch()">🔍 بحث</button>
<button class="btn btn-gold" onclick="printDetail()">🖨 الحالي</button>
<button class="btn btn-green" onclick="printAllLoop()">🖨 الكل</button>
<div id="countInfo" style="font-weight:bold;font-size:12px"></div>
<div style="margin-right:auto;display:flex;gap:6px;align-items:end;border-right:2px dashed #aaa;padding-right:10px">
<div><b>رقم</b><br><input id="extRaqm" class="input" style="width:75px"></div>
<div><b>سنة</b><br><input id="extSana" class="input" style="width:65px"></div>
<button class="btn btn-dark" onclick="searchExternal()">🔍 خارجي</button>
</div>
</div>
<div class="date-bar" id="dateBar"></div>
<div id="filterTypeBar" style="display:flex;gap:6px;align-items:center;padding:6px;background:#e8f5e9;border:1px solid #0a7a42;border-radius:8px;margin-top:4px;min-height:36px">
<span style="font-weight:bold;font-size:11px">نوع العرض:</span>
<button id="btnAll" class="btn-type" onclick="setFilterType('all')">📋 الكل (الجلسة كلها بنفس ترتيب كود الجلسات)</button>
<button id="btnNew" class="btn-type-new active" onclick="setFilterType('new')">🆕 الجديد فقط</button>
<span id="filterTypeInfo" style="margin-right:auto;font-size:11px;font-weight:bold;color:#0A2342"></span>
</div>
<div class="main-split">
<div class="list-wrap"><div class="list-head">قائمة - <span id="listTitle">-</span> <span id="listCount">(٠)</span> <span id="dayTitle"></span></div><div class="list-body" id="listBody"></div></div>
<div class="detail-wrap"><div class="raqm" id="dRaqm">اختر قضية</div><div class="most" id="dMostanef">المستأنف</div><div class="row-vs"><div class="vs">ضــــد</div><div class="noa"><b>نوع الدعوى:</b> <span id="dNoa">-</span></div></div><div class="most" id="dDed">ضده</div></div>
</div>
<script src="daira-core.js"></script>
<script>
const DB_NAME='D32_DB';let DATA=[];let currentList=[];let allMonthCases=[];let newMonthCases=[];let filteredByDayBase=[];let filteredByDay=[];let currentIndex=-1;let currentDay=null;let filterType='new';
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,2);r.onupgradeneeded=e=>{let db=e.target.result;if(!db.objectStoreNames.contains('cases'))db.createObjectStore('cases');if(!db.objectStoreNames.contains('ahkam'))db.createObjectStore('ahkam');if(!db.objectStoreNames.contains('d32store'))db.createObjectStore('d32store');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k,s){let db=await openDB();return new Promise(r=>{try{let tx=db.transaction(s,'readonly');let req=tx.objectStore(s).get(k);req.onsuccess=()=>r(req.result);req.onerror=()=>r(null);}catch(e){r(null);}});}
function mapData(arr){return arr.map((x,i)=>{if(x._fileIndex==null) x._fileIndex=i;if(x._manualOrder==null && x._sessionOrder!=null) x._manualOrder=x._sessionOrder;if(x._sessionOrder==null && x._manualOrder!=null) x._sessionOrder=x._manualOrder;if(x._manualOrder==null && x._sessionOrder==null) x._manualOrder=x._fileIndex;if(x._sessionOrder==null) x._sessionOrder=x._manualOrder;if(x._seq==null) x._seq=x._manualOrder!=null?x._manualOrder:x._fileIndex;if(x._updatedAt==null) x._updatedAt=0;x.id=x.id||i+1;if(!x.jalsat) x.jalsat=[];if(!x.halat) x.halat='متداول';if(x.zawgy===undefined) x.zawgy=1;if(!x.dammList) x.dammList=[];return x;});}

async function loadFromDB(){let raw=null;try{raw=await idbGet('D32_V3','cases');}catch(e){}if(!raw){try{raw=await idbGet('D32_V3','d32store');}catch(e){}}if(!raw){try{raw=localStorage.getItem('D32_V3')||localStorage.getItem('D32_FINAL');}catch(e){}}if(!raw && window.parent!==window){raw=await new Promise(res=>{let t=setTimeout(()=>res(null),1200);window.addEventListener('message',function h(e){if(e.data&&e.data.type==='D32_VAL'&&e.data.key==='D32_V3'){clearTimeout(t);window.removeEventListener('message',h);res(e.data.val);}});try{window.parent.postMessage({type:'D32_GET',key:'D32_V3'},'*');}catch{clearTimeout(t);res(null);}});}if(raw){try{let a=JSON.parse(raw);if(Array.isArray(a)&&Array.isArray(a[1]))a=a[1];DATA=mapData(a||[]);}catch(e){DATA=[];}}document.getElementById('log').textContent=DATA.length+' قضية - بنفس ترتيب كود الجلسات';}
function cleanDate(s){if(!s)return'';s=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/-/g,'/').trim();let m=s.match(/\d+/g);if(!m||m.length<3)return s;let y,mo,d;if(m[0].length==4){y=m[0];mo=m[1];d=m[2];}else{d=m[0];mo=m[1];y=m[2];if(y.length==2)y='20'+y;}return y+'/'+String(mo).padStart(2,'0')+'/'+String(d).padStart(2,'0');}
function parseDate(s){let c=cleanDate(s);if(!c)return null;let p=c.split('/');return{y:parseInt(p[0]),mo:parseInt(p[1]),d:parseInt(p[2]),str:c};}
function parseDateStr(s){let c=cleanDate(s);if(!c)return null;let p=c.split('/');return{str:c,y:parseInt(p[0]),mo:parseInt(p[1]),d:parseInt(p[2])};}
function datesEqual(a,b){a=cleanDate(a);b=cleanDate(b);if(!a||!b)return false;let pa=a.split('/').map(Number),pb=b.split('/').map(Number);return pa[0]==pb[0]&&pa[1]==pb[1]&&pa[2]==pb[2];}
function toAr(n){return String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
function toArText(s){return String(s||'').replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
function formatNames(txt){if(!txt) return '-';txt=String(txt).trim();let parts=txt.split(/\s*\/\s*|\s*،\s*|\n/).map(s=>s.trim()).filter(Boolean);if(parts.length<=1) return '<div>'+txt+'</div>';return parts.map(p=>'<div>'+toArText(p)+'</div>').join('');}
function formatYMD(s){return cleanDate(s)||s;}
function initMonths(){let sel=document.getElementById('selMonth');let months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];let now=new Date();let curMonth=now.getMonth()+1;let curYear=now.getFullYear();let defaultMonth=curMonth===12?1:curMonth+1;let defaultYear=curMonth===12?curYear+1:curYear;for(let i=1;i<=12;i++){let o=document.createElement('option');o.value=i;o.textContent=toAr(i)+' - '+months[i-1];if(i===defaultMonth) o.selected=true;sel.appendChild(o);}document.getElementById('selYear').value=defaultYear;}

// نفس دالة getCasesForDate من كود الجلسات بالظبط
function getCasesForDate(s){
  let t=parseDateStr(s); if(!t) return[]; let seen={}; let list=[];
  DATA.forEach((ap, fileIdx)=>{
    if(ap.tarikhHokm && datesEqual(ap.tarikhHokm, t.str)) return;
    if(ap.dammTo){ if(!ap.dammDate||!datesEqual(ap.dammDate,t.str)) return; }
    let matched=false; let jMatched=null;
    if(ap.jalsat){ for(let k=0;k<ap.jalsat.length;k++){ let j=ap.jalsat[k]; if(j.isMahgoz) continue; let pd=parseDateStr(j.tarikh); if(pd&&datesEqual(pd.str,t.str)){ matched=true; jMatched=j; break; } } }
    let b=ap.galsaAsasia||''; if(!matched && b && datesEqual(b,t.str)){ matched=true; jMatched=ap.jalsat.find(x=>datesEqual(x.tarikh,t.str))||{tarikh:t.str,qarar:'',ta2gil:ap.galsaQadima||'',halat:ap.halat||'متداول'}; }
    if(matched){ let key=ap.raqm+''+ap.sana+''+t.str; if(!seen[key]){ seen[key]=true; let order; if(ap._seq!=null && ap._seq<900000){ order=ap._seq; }else if(ap._manualOrder!=null && ap._manualOrder<900000){ order=ap._manualOrder; }else if(ap._sessionOrder!=null && ap._sessionOrder<900000){ order=ap._sessionOrder; }else if(ap._fileIndex!=null){ order=ap._fileIndex; }else{ order=fileIdx; } list.push({ap:ap,j:jMatched,apId:ap.id,fileOrder:order,date:t.str, isNew: String(ap.galsaSabiqa||ap.sabiqa||'').includes('جديد')}); } }
  });
  list.sort((a,b)=>(a.fileOrder||0)-(b.fileOrder||0)); 
  return list;
}
function getMonthDatesFromData(y,m){
  let set={};
  DATA.forEach(function(ap){
    let dates=[];
    if(ap.galsaAsasia) dates.push(cleanDate(ap.galsaAsasia));
    if(ap.jalsat) ap.jalsat.forEach(function(j){if(j.tarikh) dates.push(cleanDate(j.tarikh));if(j.ta2gil) dates.push(cleanDate(j.ta2gil));});
    dates.forEach(function(d){
      let p=parseDateStr(d);
      if(!p) return;
      if(p.y==y && p.mo==m) set[d]=true;
    });
  });
  return Object.keys(set).sort();
}

function doSearch(){
  let mo=parseInt(document.getElementById('selMonth').value);
  let yr=parseInt(document.getElementById('selYear').value);
  document.getElementById('listTitle').textContent=toAr(mo)+' / '+toAr(yr);
  let dates=getMonthDatesFromData(yr,mo);
  let allList=[];let newList=[];
  let seenKey={};
  dates.forEach(d=>{
    let casesForDate=getCasesForDate(d);
    casesForDate.forEach(it=>{
      let key=it.apId+'_'+d;
      if(seenKey[key]) return;
      seenKey[key]=true;
      allList.push(it);
      if(it.isNew) newList.push(it);
    });
  });
  allMonthCases=allList; newMonthCases=newList;
  currentList=allList;
  currentDay=null;
  applyFilter();
  buildDateButtons();
  renderList();
  if(filteredByDay.length>0)selectCase(0);
}
function setFilterType(type){
  filterType=type;
  document.getElementById('btnAll').classList.toggle('active', type==='all');
  document.getElementById('btnNew').classList.toggle('active', type==='new');
  applyFilter();
  renderList();
  if(filteredByDay.length>0)selectCase(0);
}
function applyFilter(){
  let base;
  if(currentDay===null) base=[...allMonthCases];
  else base=getCasesForDate(currentDay);
  filteredByDayBase=[...base];
  if(filterType==='new'){
    filteredByDay=base.filter(it=>it.isNew);
  }else{
    filteredByDay=[...base];
  }
  let info=document.getElementById('filterTypeInfo');
  if(info){
    let cntNewForDay = base.filter(it=>it.isNew).length;
    if(currentDay===null) cntNewForDay=newMonthCases.length;
    let totalAll= base.length;
    info.textContent='الكل: '+toAr(totalAll)+' | جديد: '+toAr(cntNewForDay)+' | المعروض: '+toAr(filteredByDay.length)+' ('+(filterType==='all'?'الكل بنفس ترتيب الجلسات':'جديد')+')';
  }
}
function buildDateButtons(){
  let bar=document.getElementById('dateBar');
  if(allMonthCases.length===0){bar.innerHTML='<span style="font-size:11px;color:#b00020">لا يوجد تواريخ في هذا الشهر</span>';return;}
  let groupsAll={};let groupsNew={};
  allMonthCases.forEach(it=>{let d=it.date;if(!groupsAll[d])groupsAll[d]=0;groupsAll[d]++; if(it.isNew){if(!groupsNew[d])groupsNew[d]=0;groupsNew[d]++;}});
  let dates=Object.keys(groupsAll).sort();
  let html='<button class="btn-day '+(currentDay===null?'active':'')+'" onclick="filterByDay(null)">الكل ('+toAr(allMonthCases.length)+' كل / '+toAr(newMonthCases.length)+' جديد)</button>';
  dates.forEach(d=>{
    let cntAll=groupsAll[d]||0;let cntNew=groupsNew[d]||0;
    html+='<button class="btn-day '+(currentDay===d?'active':'')+'" onclick="filterByDay(\''+d+'\')">'+toArText(d)+' ('+toAr(cntAll)+' كل / '+toAr(cntNew)+' جديد)</button>';
  });
  bar.innerHTML=html;
}
function filterByDay(dateStr){
  currentDay=dateStr;
  if(dateStr===null){document.getElementById('dayTitle').textContent='';}else{document.getElementById('dayTitle').textContent=' - يوم '+toArText(dateStr);}
  applyFilter();
  buildDateButtons();
  renderList();
  if(filteredByDay.length>0)selectCase(0);
}
function renderList(){
  let b=document.getElementById('listBody');
  let list=filteredByDay;
  document.getElementById('listCount').textContent='('+toAr(list.length)+')';
  let typeLabel=filterType==='all'?'الكل بنفس ترتيب الجلسات':'الجديد فقط';
  document.getElementById('countInfo').textContent='العدد: '+toAr(list.length)+' ('+typeLabel+')'+(currentDay?' / يوم '+toArText(currentDay):'');
  if(list.length===0){b.innerHTML='<div style="padding:20px;text-align:center;color:#b00020">لا يوجد قضايا '+(filterType==='new'?'(جديد فقط)':'')+' في '+ (currentDay? toArText(currentDay):'هذا الشهر')+' - جرب خيار الكل</div>';return;}
  let h='';list.forEach((it,i)=>{
    let ap=it.ap;
    let raqm=(ap.raqm||'')+' / '+(ap.sana||'');
    let orderLabel=toAr(it.fileOrder+1);
    h+=`<div class="list-item ${i===currentIndex?'active':''}" onclick="selectCase(${i})"><b style="background:#FFF9C4;padding:1px 5px;border-radius:4px">${orderLabel}</b> <b>${toArText(raqm)}</b><br><small>${(ap.mostanef||'').substring(0,22)}</small><br><small style="color:#666">${toArText(it.date)} ${it.isNew?'<span style="background:#b00020;color:#fff;padding:1px 4px;border-radius:4px">جديد</span>':''}</small></div>`;
  });b.innerHTML=h;
}
function selectCase(i){let list=filteredByDay;if(i<0||i>=list.length)return;currentIndex=i;renderList();let ap=list[i].ap;document.getElementById('dRaqm').textContent=toArText((ap.raqm||'')+' / '+(ap.sana||''));document.getElementById('dMostanef').innerHTML=formatNames(ap.mostanef||ap.most||'-');document.getElementById('dDed').innerHTML=formatNames(ap.ded||'-');document.getElementById('dNoa').textContent=toArText(ap.noa||'-');}

function searchExternal(){let r=document.getElementById('extRaqm').value.trim();let s=document.getElementById('extSana').value.trim();if(!r||!s){alert('اكتب رقم وسنة');return;}r=r.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));s=s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));let found=DATA.find(o=>String(o.raqm).trim()===String(r).trim() && String(o.sana).trim()===String(s).trim());if(!found){alert('غير موجود: '+r+' / '+s);return;}currentIndex=-1;document.getElementById('dRaqm').textContent=toArText((found.raqm||'')+' / '+(found.sana||''));document.getElementById('dMostanef').innerHTML=formatNames(toArText(found.mostanef||found.most||'-'));document.getElementById('dDed').innerHTML=formatNames(toArText(found.ded||'-'));document.getElementById('dNoa').textContent=toArText(found.noa||'-');}
function printDetail(){let ap=null;let fileOrder=0;if(currentIndex>=0 && filteredByDay[currentIndex]){ap=filteredByDay[currentIndex].ap; fileOrder=filteredByDay[currentIndex].fileOrder;}else{alert('اختر قضية');return;}let css='@page{size:A4 portrait;margin:12mm} *{font-family:Arial} body{direction:rtl;padding:20px}.raqm{font-size:22px;font-weight:bold;text-align:center;margin-bottom:30px}.most{font-size:21px;text-align:right;margin:8px 0;line-height:1.8}.row-vs{display:flex;justify-content:space-between;margin:16px 0}.vs{font-weight:bold;font-size:20px}.noa{font-size:18px}';let html='<html dir=rtl><head><meta charset=utf-8><style>'+css+'</style></head><body><div class="raqm">'+toArText((ap.raqm||'')+' / '+(ap.sana||''))+'</div><div class="most">'+formatNames(toArText(ap.mostanef||''))+'</div><div class="row-vs"><div class="vs">ضــــد</div><div class="noa"><b>نوع الدعوى:</b> '+toArText(ap.noa||'')+'</div></div><div class="most">'+formatNames(toArText(ap.ded||''))+'</div><script>setTimeout(()=>window.print(),400)<\/script></body></html>';let w=window.open('','_blank');w.document.write(html);w.document.close();}
function printAllLoop(){let list=filteredByDay;if(list.length===0){alert('ابحث أولا');return;}let css='@page{size:A4 portrait;margin:12mm} *{box-sizing:border-box;font-family:Arial} body{direction:rtl;margin:0;padding:0}.page{height:100vh;padding:25px 20px;page-break-after:always}.page:last-child{page-break-after:auto}.raqm{font-size:22px;font-weight:bold;text-align:center;margin-bottom:40px}.most{font-size:21px;text-align:right;margin:12px 0;line-height:1.8}.row-vs{display:flex;justify-content:space-between;margin:16px 0}.vs{font-weight:bold;font-size:20px}.noa{font-size:18px}';let html='<html dir=rtl><head><meta charset=utf-8><title>طباعة الكل</title><style>'+css+'</style></head><body>';list.forEach((it,i)=>{let ap=it.ap;html+='<div class="page"><div class="raqm">'+toArText((ap.raqm||'')+' / '+(ap.sana||''))+'</div><div class="most">'+formatNames(toArText(ap.mostanef||''))+'</div><div class="row-vs"><div class="vs">ضــــد</div><div class="noa"><b>نوع الدعوى:</b> '+toArText(ap.noa||'')+'</div></div><div class="most">'+formatNames(toArText(ap.ded||''))+'</div><div style="text-align:center;margin-top:60px;font-size:10px;color:#999">'+toAr(i+1)+' / '+toAr(list.length)+' - '+toArText(it.date)+'</div></div>';});html+='<script>window.onload=()=>setTimeout(()=>window.print(),600)<\/script></body></html>';let w=window.open('','_blank');w.document.write(html);w.document.close();}
window.onload=async()=>{initMonths();await loadFromDB();doSearch();};
</script>
</body>
</html>
