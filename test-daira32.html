<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار دائرة 32 - نفس رابط التطبيق</title>
<style>body{font-family:Tahoma;background:#0A2342;color:#fff;padding:20px;text-align:center} .card{background:#fff;color:#111;max-width:600px;margin:20px auto;padding:20px;border-radius:12px;text-align:right} button{width:100%;padding:14px;background:#0A2342;color:#FFD700;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;margin:5px 0} pre{background:#f5f5f5;padding:10px;border-radius:8px;font-size:11px;direction:ltr;text-align:left;overflow:auto;max-height:300px}</style></head>
<body><h2>⚖ اختبار دائرة 32 - بنفس رابط التطبيق الشغال</h2>
<div class="card">
<button onclick="test32()">🔍 جرب دائرة 32 دلوقتي</button>
<div id="res" style="margin-top:12px;line-height:1.9;font-size:13px"></div>
<pre id="raw" style="display:none"></pre>
<p style="font-size:11px;color:#666">الرابط المستخدم هو نفسه اللي في التطبيق الأساسي - من غير أي إضافات</p>
</div>
<script>
const CLOUD_URL='https://script.google.com/macros/s/AKfycbwOTKlstkN7iqYr9IX_CM43EKs6ViBDpMcNJH7s3tU-52LCRIQAFjbI7sx_AD240A/exec?action=get&daira=32';
async function test32(){
  const res=document.getElementById('res'); const raw=document.getElementById('raw');
  res.innerHTML='⏳ بجرب...'; raw.style.display='none';
  try{
    let r=await fetch(CLOUD_URL,{cache:'no-store'});
    res.innerHTML+='<br>HTTP: '+r.status+' '+r.statusText+' | نوع الرد: '+r.headers.get('content-type');
    let t=await r.text();
    raw.style.display='block'; raw.textContent=t.slice(0,2000);
    res.innerHTML+='<br>طول الرد: '+t.length+' حرف ('+(t.length/1024).toFixed(1)+' KB)';
    if(t.trim().startsWith('<!DOCTYPE')||t.trim().startsWith('<html')){
      res.innerHTML+='<br><b style="color:#b00020">❌ رجع HTML - السكريبت مش منشور Anyone</b><br>الحل: Google Apps Script > Deploy > Manage deployments > Edit > Who has access: Anyone > Deploy';
      return;
    }
    let j={}; try{ j=JSON.parse(t);}catch(e){ res.innerHTML+='<br><b style="color:#b00020">❌ مش JSON: '+e.message+'</b>'; return; }
    if(Array.isArray(j)) j={v3:j,ahkam:[]};
    res.innerHTML+='<br>مفاتيح: '+Object.keys(j).join(', ');
    res.innerHTML+='<br>عدد القضايا v3: <b>'+(Array.isArray(j.v3)?j.v3.length:'مش Array - نوعه '+typeof j.v3)+'</b>';
    res.innerHTML+='<br>أحكام: '+(Array.isArray(j.ahkam)?j.ahkam.length:'-');
    res.innerHTML+='<br>باسورد: '+((j._password||j.password)?'موجود':'مفيش');
    res.innerHTML+='<br>error: '+(j.error||'مفيش');
    if(Array.isArray(j.v3) && j.v3.length>0){
      res.innerHTML+='<br><b style="color:#16a34a">✅ الدرايف شغال - دائرة 32 فيها بيانات</b><br>أول قضية: '+(j.v3[0].raqm||'')+' / '+(j.v3[0].sana||'');
    } else {
      res.innerHTML+='<br><b style="color:#b00020">⚠️ الدرايف رجع v3 فاضي - الدائرة ملهاش بيانات في الدرايف</b>';
    }
  }catch(e){ res.innerHTML='❌ فشل: '+e.message; }
}
</script></body></html>
