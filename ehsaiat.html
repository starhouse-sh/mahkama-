<script>
const DB_NAME='D32_DB';
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,2);r.onupgradeneeded=e=>{let db=e.target.result;if(!db.objectStoreNames.contains('cases'))db.createObjectStore('cases');if(!db.objectStoreNames.contains('ahkam'))db.createObjectStore('ahkam');if(!db.objectStoreNames.contains('d32store'))db.createObjectStore('d32store');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function getMot(){
  let db=await openDB();
  let tx=db.transaction('cases','readonly');
  let rq=tx.objectStore('cases').get('D32_V3');
  return new Promise(r=>{
    rq.onsuccess=()=>{if(rq.result){try{let a=JSON.parse(rq.result); if(Array.isArray(a[1])) a=a[1]; r({data:a,data2:a}); return;}catch(e){}} r({data:[],data2:[]});};
    rq.onerror=()=>r({data:[],data2:[]});
  });
}
async function getAhkam(){
  let db=await openDB();
  let tx=db.transaction('ahkam','readonly');
  let rq=tx.objectStore('ahkam').get('D32_AHKAM');
  return new Promise(r=>{
    rq.onsuccess=()=>{if(rq.result){try{let a=JSON.parse(rq.result); if(Array.isArray(a[1])) a=a[1]; r(a); return;}catch(e){}} r([]);};
    rq.onerror=()=>r([]);
  });
}
async function getDairaInfoFull(){
  var info={daira:'32', week:'الأسبوع الأول', judges:[], members:[], aminSir:''};
  try{
    let db=await openDB();
    let tx=db.transaction('d32store','readonly');
    let st=tx.objectStore('d32store');
    let allKeys = await new Promise(res=>{let req=st.getAllKeys(); req.onsuccess=()=>res(req.result||[]); req.onerror=()=>res([]);});
    let want=['D32_DAIRA_CONFIG','D32_CIRCLE','D32_DAIRA','D32_DAIRA_INFO','D32_CONFIG','D32_SETTINGS','معلومات الدائرة','بيانات الدائرة','D32_INFO','D32_DAIRA_DATA','D32_JUDGES','D32_AMIN','aminSir','amin','أمين السر','امين السر'];
    let keys=[...new Set([...want,...allKeys])];
    for(let ki=0;ki<keys.length;ki++){
      let k=keys[ki];
      let val=await new Promise(res=>{let rq=st.get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null);});
      if(!val) continue;
      try{
        if(typeof val==='string' && /[أ-ي]/.test(val) && (k.toLowerCase().indexOf('amin')>=0 || k.indexOf('أمين')>=0 || k.indexOf('امين')>=0)){ info.aminSir=val; continue; }
        var obj = typeof val==='string'?JSON.parse(val):val;
        if(!obj){ if(typeof val==='string' && /[أ-ي]/.test(val) && k.toUpperCase().indexOf('AMIN')>=0) info.aminSir=val; continue; }
        if(typeof obj==='string' && (k.toLowerCase().indexOf('amin')>=0)){ info.aminSir=obj; continue; }
        if(typeof obj==='object'){
          if(obj.aminSir) info.aminSir=obj.aminSir;
          if(obj.amin) info.aminSir=obj.amin;
          if(obj['أمين السر']) info.aminSir=obj['أمين السر'];
          if(obj['امين السر']) info.aminSir=obj['امين السر'];
          if(obj.dairaNumber) info.daira=obj.dairaNumber;
          if(obj.daira) info.daira=obj.daira;
          if(obj.circle) info.daira=obj.circle;
          if(obj.week) info.week=obj.week;
          if(obj.dawr) info.week=obj.dawr;
          if(obj.usb) info.week=obj.usb;
          if(obj.a3daa){
            var txt=String(obj.a3daa);
            var parts=txt.split(/\n|,/).map(s=>s.trim()).filter(s=>s);
            let cleaned=[];
            parts.forEach(p=>{
              let c=p.replace(/^\s*\d{8}\s*\/\s*/,'').replace(/^\s*\d{4}[\/\-]\d{2}[\/\-]\d{2}\s*\/\s*/,'');
              c=c.replace(/السيد المستشار\s*\/\s*/g,'').replace(/السيد المستشار/g,'').replace(/المستشار\s*\/\s*/g,'').replace(/المستشار/g,'').replace(/\//g,' ').trim();
              c=c.replace(/\d+/g,'').trim();
              if(c.length>=3 && /[أ-ي]/.test(c)) cleaned.push(c);
            });
            if(cleaned.length){ info.judges=cleaned; info.members=cleaned.map(pp=>({name:pp})); }
          }
          let possible = obj.members || obj.judges || obj['المستشارين'] || obj['القضاة'];
          if(possible && Array.isArray(possible) && possible.length){
            let cleaned=[];
            possible.forEach(m=>{
              if(!m) return;
              let raw = typeof m==='string'?m:(m.name||'');
              let c=raw.replace(/^\s*\d{8}\s*\/\s*/,'').replace(/^\s*\d{4}[\/\-]\d{2}[\/\-]\d{2}\s*\/\s*/,'');
              c=c.replace(/السيد المستشار\s*\/\s*/g,'').replace(/السيد المستشار/g,'').replace(/المستشار\s*\/\s*/g,'').replace(/المستشار/g,'').replace(/\//g,' ').replace(/\d+/g,'').trim();
              if(c.length>=3 && /[أ-ي]/.test(c)) cleaned.push(c);
            });
            if(cleaned.length){ info.judges=cleaned; info.members=cleaned.map(n=>({name:n})); }
          }
        }
      }catch(e){}
    }
  }catch(e){}
  return info;
}
function toAr(n){
  if(n===null||n===undefined||n==='') return '';
  return String(n).replace(/[0-9]/g, d=>'٠١٢٣٤٥٦٧٨٩'[d]);
}
function toArDisplay(v){
  if(v===null||v===undefined||v==='') return '&nbsp;';
  if(v===0) return '٠';
  return toAr(v);
}
function cleanDate(s){if(!s)return'';s=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/-/g,'/').trim();var m=s.match(/\d+/g);if(!m||m.length<3)return'';var d,mo,ye;if(m[0].length==4){ye=m[0];mo=m[1];d=m[2];}else{d=m[0];mo=m[1];ye=m[2];if(ye.length==2)ye='20'+ye;}return ye+'/'+String(mo).padStart(2,'0')+'/'+String(d).padStart(2,'0');}
function zawgyCountNormal(ap){
  if(ap.dammList && ap.dammList.length>0) return 2;
  if(ap.damm && ap.damm.length>0) return 2;
  if(ap.mondam && ((Array.isArray(ap.mondam) && ap.mondam.length>0) || (typeof ap.mondam==='string' && ap.mondam.trim()!=''))) return 2;
  if(ap.dammTo || ap.damTo || ap.mondamList || ap.estenafatMondama) {
    var fields=['dammTo','damTo','mondamList','estenafatMondama','mondamat','mondamElaRaqm','raqmMondamEla'];
    for(var i=0;i<fields.length;i++){
      var f=fields[i];
      if(ap[f] && ((Array.isArray(ap[f]) && ap[f].length>0) || (typeof ap[f]==='string' && ap[f].trim()!='') || (typeof ap[f]==='number' && ap[f]>0))) return 2;
    }
  }
  var z = ap.zawgy;
  if(z===undefined || z===null || z==='') z = ap.zawgyFardy;
  if(z===undefined || z===null || z==='') z = ap['زوجي'];
  if(z===undefined || z===null || z==='') z = ap['زوجى'];
  if(z===undefined || z===null || String(z).trim()==='') return 1;
  if(z===0 || z==='0') return 0;
  var zs = toEnNum(String(z)).trim();
  if(zs==='2') return 2;
  if(zs==='1') return 1;
  var nz = parseInt(zs);
  if(nz===2) return 2;
  if(nz===1) return 1;
  return 1;
}
function parseDateStr(s){var cd=cleanDate(s);if(!cd)return null;var p=cd.split('/');return{str:cd,y:parseInt(p[0]),mo:parseInt(p[1]),d:parseInt(p[2])};}
function toEnNum(s){
 return String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)); }
function parseDate(s){
  if(!s) return null;
  s=toEnNum(String(s).trim());
  var m8 = s.match(/^\s*(\d{4})(\d{2})(\d{2})\s*$/);
  if(m8) return {y:parseInt(m8[1]), m:parseInt(m8[2]), d:parseInt(m8[3]), day:parseInt(m8[3]), str:m8[1]+'/'+String(m8[2]).padStart(2,'0')+'/'+String(m8[3]).padStart(2,'0')};
  s=s.replace(/-/g,'/').replace(/\\/g,'/').trim();
  if(s.includes(' ')) s=s.split(' ')[0];
  var clean = s.replace(/[^0-9\/]/g,'');
  if(!clean.includes('/')) return null;
  var p=clean.split('/').map(x=>parseInt(x.trim())).filter(x=>!isNaN(x));
  if(p.length!=3) return null;
  if(p[0]>1000) return {y:p[0],m:p[1],d:p[2],day:p[2], str:p[0]+'/'+String(p[1]).padStart(2,'0')+'/'+String(p[2]).padStart(2,'0')};
  if(p[2]>1000) return {y:p[2],m:p[1],d:p[0],day:p[0], str:p[2]+'/'+String(p[1]).padStart(2,'0')+'/'+String(p[0]).padStart(2,'0')};
  return null;
}
function zawgyCountOne(ap){ return 1; }
function contains(h,s){ if(!h) return false; h=String(h); for(var i=0;i<s.length;i++) if(h.includes(s[i])) return true; return false; }
function normalizeMahkama(name){
  if(!name) return '';
  var s = String(name).trim();
  s = s.replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[أإآ]/g,'ا').replace(/ـ/g,'').replace(/\s+/g,' ').trim();
  s = s.replace(/محكمه|محكمة/g,'').trim().replace(/اسره|أسرة|اسره/g,'').trim().replace(/\s+/g,' ').trim();
  return s;
}
function getGazKeyNormalized(raqmAwal, sanaAwal, mahkama){
  var r = toEnNum(raqmAwal||'').trim().replace(/[^0-9]/g,'');
  var ss = toEnNum(sanaAwal||'').trim().replace(/[^0-9]/g,'');
  var m = normalizeMahkama(mahkama||'');
  if(!r || !ss) return '';
  return r + '/' + ss + '/' + m;
}
function getBestRecord(records){
  if(!records||!records.length) return null;
  return records.slice().sort((a,b)=>{
    const aHas=(a.qararHokm&&a.qararHokm.includes('حجز'))||(a.jalsat&&a.jalsat.some(j=>(j.qarar||'').includes('حجز')));
    const bHas=(b.qararHokm&&b.qararHokm.includes('حجز'))||(b.jalsat&&b.jalsat.some(j=>(j.qarar||'').includes('حجز')));
    if(aHas&&!bHas) return -1;
    if(!aHas&&bHas) return 1;
    const aLen=(a.jalsat||[]).length, bLen=(b.jalsat||[]).length;
    if(aLen!==bLen) return bLen-aLen;
    return (b.tarikhHokm||'').localeCompare(a.tarikhHokm||'');
  })[0];
}
function getAsasiaDateFixed(ap){
  if(ap.jalsat&&ap.jalsat.length){
    var latest=null;
    for(var i=0;i<ap.jalsat.length;i++){
      var d=parseDate(ap.jalsat[i].tarikh);
      if(!d) continue;
      if(!latest||d.y>latest.y||(d.y===latest.y&&d.m>latest.m)||(d.y===latest.y&&d.m===latest.m&&d.d>latest.d)) latest=d;
    }
    if(latest) return latest;
  }
  var cand=[ap.galsaAsasia,ap.galsaAsasiya,ap['الجلسة الاساسية'],ap['الجلسة الأساسية'],ap.galsa];
  for(var i=0;i<cand.length;i++){ var d=parseDate(cand[i]); if(d) return d; }
  return null;
}
function getAsasiaDate(ap){ return getAsasiaDateFixed(ap); }
function getAllSessionDates(ap){
  var cand=[];
  var fields=[ap.galsaAsasia, ap.galsaAsasiya, ap.galsa];
  fields.forEach(function(f){ if(f) cand.push(f); });
  if(ap.jalsat && ap.jalsat.length){
    ap.jalsat.forEach(function(j){ if(j.tarikh) cand.push(j.tarikh); if(j.ta2gil) cand.push(j.ta2gil); });
  }
  var dates=[]; var seen={};
  cand.forEach(function(raw){
    var cd=cleanDate(raw||'');
    if(!cd) return;
    if(seen[cd]) return;
    seen[cd]=true;
    var d=parseDate(cd);
    if(d) dates.push(d);
  });
  return dates;
}
function getAhkamDate(h){ return h.tarHokm||h.tarikhHokm||h.tarikh||''; }
function getAhkamNo3(h){ return h.mantouq||h.qar||h.no3Hokm||h.no3||''; }
async function calc(){
  var mSel=parseInt(document.getElementById('m').value), ySel=parseInt(document.getElementById('y').value);
  var res=await getMot(); var motRaw=res.data; var ahkam=await getAhkam(), daira=await getDairaInfoFull();
  var isSame=(d)=>d&&d.m===mSel&&d.y===ySel;
  var mot = (function(){
    var seenId={}; var out=[];
    motRaw.forEach(function(ap){
      var id = ap.id;
      if(id!==undefined && id!==null && id!==''){
        if(seenId[id]) return;
        seenId[id]=true;
      }
      out.push(ap);
    });
    return out;
  })();
  var groupedAll={};
  motRaw.forEach(function(ap){
    var key=(ap.raqm||'')+'_'+(ap.sana||ap['سنة الاستئناف']||'');
    if(!groupedAll[key]) groupedAll[key]=[];
    groupedAll[key].push(ap);
  });
  var motBest=[];
  Object.values(groupedAll).forEach(function(recs){
    var best=getBestRecord(recs);
    if(best) motBest.push(best);
  });
  var motUnique = mot;
  var ahkamUnique = (function(){
    var seenA={}; var out=[];
    ahkam.forEach(function(h){
      var r = String(h.raqm||h.raqmEst||h.raqmQadya||h['رقم الاستئناف']||'').trim();
      var sn = String(h.sana||h['سنة الاستئناف']||h.sanaEst||'').trim();
      var dt = String(getAhkamDate(h)||'').trim();
      var cd = String(h.code||h.qadyCode||'').trim().toUpperCase();
      if(!r && !sn){ out.push(h); return; }
      // dedup برقم+سنة+تاريخ+كود فقط - مش بالمنطوق
      // لأن نفس القضية ممكن يبقى ليها سجلين بمنطوقين مختلفين (مختصر وكامل) زي 24586/142 في 3/11/2026
      // ولو حطينا المنطوق في المفتاح، المكرر هيتعد مرتين - ولو ضم هيتعد 2 زيادة
      var k = toEnNum(r)+'_'+toEnNum(sn)+'_'+toEnNum(dt)+'_'+cd;
      // لو المكرر منطوقه أطول (كامل) خده بدل المختصر
      if(seenA[k]){
        var prev = out[seenA[k]];
        var curNo3 = String(getAhkamNo3(h)||'').length;
        var prevNo3 = String(getAhkamNo3(prev)||'').length;
        if(curNo3 > prevNo3) out[seenA[k]] = h;
        return;
      }
      seenA[k]=out.length; out.push(h);
    });
    return out;
  })();
  var dateMap={};
  function isMahgozForP1(ap, dateStr){
    try{
      var target = dateStr ? cleanDate(dateStr) : '';
      function txtOf(j){
        if(!j) return '';
        return (j.qarar||'')+' '+(j.sababTa2gil||'')+' '+(j.halat||'')+' '+(ap.qararHokm||'')+' '+(ap.qarar||'');
      }
      function isMahgozTxt(txt){
        if(!txt) return false;
        if(txt.indexOf('إعادة للمرافعة')>=0 || txt.indexOf('اعادة للمرافعة')>=0 || txt.indexOf('اعاده للمرافعة')>=0) return false;
        return txt.indexOf('حجز للحكم')>=0 || txt.indexOf('محجوز للحكم')>=0 || (txt.indexOf('حجز')>=0 && txt.indexOf('للحكم')>=0);
      }
      if(ap.jalsat && ap.jalsat.length>0 && target){
        for(var _i=0; _i<ap.jalsat.length; _i++){
          var _jd = parseDate(ap.jalsat[_i].tarikh||'');
          if(_jd && _jd.str===target) return false;
        }
        for(var _k=0; _k<ap.jalsat.length; _k++){
          var _jj=ap.jalsat[_k];
          var _t2d = parseDate(_jj.ta2gil||'');
          if(_t2d && _t2d.str===target && isMahgozTxt(txtOf(_jj))) return true;
        }
        return false;
      }
      var _basic = cleanDate(ap.galsaAsasia || ap.galsaAsasiya || ap['الجلسة الاساسية'] || ap.galsa || '');
      if(_basic===target) return false;
      return false;
    }catch(e){}
    return false;
  }
  var dateMapInner={};
  motUnique.forEach(function(ap){
    var allDates=getAllSessionDates(ap);
    if(!allDates.length) return;
    allDates.forEach(function(d){
      if(!isSame(d)) return;
      if(isMahgozForP1(ap, d.str)) return;
      var key=d.str;
      if(!dateMapInner[key]) dateMapInner[key]=new Map();
      var raqm=String(ap.raqm||ap.id||'').trim();
      var sana=String(ap.sana||ap['سنة الاستئناف']||'').trim();
      var uniqKey=toEnNum(raqm)+'_'+toEnNum(sana);
      if(!uniqKey || uniqKey=='_') uniqKey=String(ap.id||Math.random());
      if(!dateMapInner[key].has(uniqKey)){
        dateMapInner[key].set(uniqKey, ap);
      }
    });
