<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="daira-core.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<title>دائرة 32 - محاضر جلسات - FIXED ترتيب نفس الجلسة</title>
<style>
body{font-family:Tahoma;background:#eef2f7;margin:0;padding:10px}
header{background:#0f1f3a;color:#fff;padding:10px;border-radius:10px}
.card{background:#fff;padding:10px;border-radius:10px;margin-top:8px}
.btn{cursor:pointer;border:none;border-radius:6px;font-weight:bold;font-family:Tahoma;padding:7px 12px;font-size:13px}
.mahdar-page{font-family:Arial,Tahoma;padding:12px 20px;min-height:980px;max-height:980px;background:#fff;color:#000;font-size:16px;line-height:1.3;display:flex;flex-direction:column;border:2px solid #333;max-width:820px;margin:10px auto;direction:rtl;box-sizing:border-box;overflow:hidden}
.galsa-line{font-size:16px;text-align:center;margin:4px 0 4px}
.haya-line{display:flex;justify-content:space-between;margin:1px 0;font-size:16px}

.footer-block{margin-top:12px;page-break-inside:avoid;break-inside:avoid}

.hayaBox{background:#fff;padding:15px;border-radius:12px;width:480px;border:3px solid #0A2342;max-height:92vh;overflow:auto}
.hayaBox h3{background:#0f1f3a;color:#fff;padding:8px;border-radius:8px;text-align:center;margin:0 0 10px}
.hayaBox label{font-weight:bold;font-size:12px;display:block;margin-top:8px}
.hayaBox input{width:100%;padding:8px;border:1px solid #999;border-radius:6px;font-weight:bold;margin-top:3px}
@media print{
 @page{size:A4;margin:7mm}
 body{background:#fff!important;padding:0!important;margin:0!important}
 .no-print{display:none!important}
 #printArea{margin:0!important;padding:0!important}
 #mhDisplay{margin:0!important;padding:0!important}

   border:none!important;
   min-height:95vh!important;
   max-height:none!important;
   height:auto!important;
   padding:8px 14px!important;
   page-break-after:always!important;
   break-after:page!important;
   page-break-inside:avoid!important;
   overflow:visible!important;
   display:block!important;
   float:none!important;
 }
 .mahdar-page:last-child{
   page-break-after:auto!important;
   break-after:auto!important;
 }
 .footer-block{margin-top:10px!important; page-break-inside:avoid!important}
}
</style>
</head>
<body>
<header class="no-print">⚖ دائرة 32 - D32_DB فقط | العدد: <b id="cnt">0</b></header>
<div class="card no-print">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<input type="date" id="mhDate" style="padding:6px;border-radius:5px;border:1px solid #ccc">

<button onclick="openHayaModal()" class="btn" style="background:#0A4A3C;color:#fff">⚙ الهيئة (مؤقت للمحضر)</button>
<button onclick="printCurrentMahdar()" class="btn" style="background:#0A2342;color:#fff">🖨 الحالي</button>
<button onclick="printAllMahader()" class="btn" style="background:#C9A227">🖨 الكل (<span id="mhPrintCount">0</span>)</button>
</div>
</div>
<div id="printArea"><div id="mhDisplay"></div></div>

<div id="hayaModal">
  <div class="hayaBox">
    <h3>⚙ تشكيل الهيئة - تعديل للمحضر الحالي فقط</h3>
    <label>1 - رئيس المحكمة</label><input id="h_j1">
    <label>2 - عضو</label><input id="h_j2">
    <label>3 - عضو</label><input id="h_j3">
    <label>4 - عضو</label><input id="h_j4">
    <label>5 - عضو</label><input id="h_j5">
    <label>6 - عضو</label><input id="h_j6">
    <label>7 - عضو</label><input id="h_j7">
    <hr style="margin:12px 0">
    <label>رئيس / وكيل النيابة</label><input id="h_neyaba">
    <label>أمين السر / سكرتير الجلسة</label><input id="h_amin">
    <div style="display:flex;gap:8px;margin-top:14px">
      <button onclick="saveHaya()" class="btn" style="background:#0A2342;color:#fff;flex:2;padding:10px">💾 حفظ للمحضر الحالي فقط</button>
      <button onclick="closeHayaModal()" class="btn" style="background:#b00020;color:#fff;flex:1">✖ إغلاق</button>
    </div>
  </div>
</div>

<script>
// FIX: رقم الدائرة ديناميكي مش ثابت 32
function getCurrentDairaNum(){
  try{
    return localStorage.getItem('current_daira') || localStorage.getItem('DAIRA') || (window.parent && window.parent.localStorage ? window.parent.localStorage.getItem('current_daira') : null) || '32';
  }catch(e){ return '32'; }
}
const DB_NAME='D'+getCurrentDairaNum()+'_DB';
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,2);r.onupgradeneeded=e=>{let db=e.target.result;if(!db.objectStoreNames.contains('cases'))db.createObjectStore('cases');if(!db.objectStoreNames.contains('ahkam'))db.createObjectStore('ahkam');if(!db.objectStoreNames.contains('d32store'))db.createObjectStore('d32store');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
var DATA=[];
var TEMP_HAYA = null;
async function loadData(){let db=await openDB();let tx=db.transaction('cases','readonly');let rq=tx.objectStore('cases').get('D32_V3');return new Promise(res=>{rq.onsuccess=()=>{if(rq.result){try{let a=JSON.parse(rq.result); if(Array.isArray(a[1])) a=a[1]; DATA=a.map((x,i)=>{
if(x._fileIndex==null) x._fileIndex=i;
if(x._manualOrder==null && x._sessionOrder!=null) x._manualOrder=x._sessionOrder;
if(x._sessionOrder==null && x._manualOrder!=null) x._sessionOrder=x._manualOrder;
if(x._manualOrder==null && x._sessionOrder==null) x._manualOrder=x._fileIndex;
if(x._sessionOrder==null) x._sessionOrder=x._manualOrder;
if(x._updatedAt==null) x._updatedAt=0;
x.galsa=cleanDate(x.galsa||'');x.galsaAsasia=cleanDate(x.galsaAsasia||x.galsa||'');x.id=x.id||i+1;if(!x.jalsat)x.jalsat=[];x.jalsat=x.jalsat.map(j=>{j.tarikh=cleanDate(j.tarikh||'');j.ta2gil=cleanDate(j.ta2gil||'');return j;});return x;});}catch(e){}} document.getElementById('cnt').textContent=DATA.length; res();}; rq.onerror=()=>res();});}
function cleanDate(s){if(!s)return'';s=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/-/g,'/').trim();var m=s.match(/\d+/g);if(!m||m.length<3)return'';var d,mo,ye;if(m[0].length==4){ye=m[0];mo=m[1];d=m[2];}else{d=m[0];mo=m[1];ye=m[2];if(ye.length==2)ye='20'+ye;}return ye+'/'+String(mo).padStart(2,'0')+'/'+String(d).padStart(2,'0');}
function parseDateStr(s){var cd=cleanDate(s);if(!cd)return null;var p=cd.split('/');return{str:cd,y:parseInt(p[0]),mo:parseInt(p[1]),d:parseInt(p[2])};}
function datesEqual(a,b){a=cleanDate(a);b=cleanDate(b);return a&&b&&a===b;}
function toArabicNum(str){if(!str)return'';return String(str).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
function getCurrentYearLogic(){var now=new Date();var y=now.getMonth()==11?now.getFullYear()+1:now.getFullYear();return toArabicNum(y);}
var DAIRA_CACHE=null;
function cleanName(v){
  if(v===null||v===undefined) return '';
  if(typeof v==='string'){
    if(v==='[object Object]'||v.indexOf('[object Object]')>=0) return '';
    return v.trim();
  }
  if(typeof v==='object'){
    return cleanName(v.name||v.raees||v.text||v.value||'');
  }
  return String(v).trim();
}
// FIX: يقرأ من كل الأماكن وبكل الصيغتين - القديمة والجديدة
function normalizeDairaInfo(s, dairaNum){
  if(!s) return null;
  if(typeof s==='string'){ try{ s=JSON.parse(s); }catch(e){ return null; } }
  // members ممكن تكون: ['اسم1','اسم2'] أو [{name,code}] أو [{name}] أو مفصولة
  var membersRaw = s.members || s.membersObj || [];
  var names = [];
  if(Array.isArray(membersRaw)){
    membersRaw.forEach(function(m){
      if(typeof m==='string') names.push(cleanName(m));
      else if(m && typeof m==='object') names.push(cleanName(m.name||m.raees||m.text||m.value));
    });
  }
  // لو members فاضية، جرب الحقول المنفصلة بتاعة daira-config الجديدة
  if(!names.filter(function(n){return n;}).length){
    names = [
      cleanName(s.raees),
      cleanName(s.odw2 || s.yameen),
      cleanName(s.odw3 || s.shamal),
      cleanName(s.odw4),
      cleanName(s.odw5),
      cleanName(s.odw6),
      cleanName(s.odw7)
    ];
  }
  // نظف [object Object] من كل الأسماء
  names = names.map(cleanName);
  return {
    num: cleanName(s.dairaNumber||s.num||s.daira||dairaNum||'32') || '32',
    list: names.filter(function(n){return n;}), // للمحضر: كل الأسماء الموجودة
    j1: names[0]||'',
    j2: names[1]||'',
    j3: names[2]||'',
    j4: names[3]||'',
    j5: names[4]||'',
    j6: names[5]||'',
    j7: names[6]||'',
    neyaba: cleanName(s.raeesNiyaba||s.wakil||s.neyaba||s.raeesNeyabaName||''),
    amin: cleanName(s.ameenSerr||s.amin||s.ameen||s.secretary||''),
    dawr: cleanName(s.dawr||''),
    fatra: cleanName(s.fatra||'')
  };
}
async function getDaira(){
  if(TEMP_HAYA) return TEMP_HAYA;
  if(DAIRA_CACHE) return DAIRA_CACHE;
  var dairaNum = getCurrentDairaNum();
  var keys = ['D'+dairaNum+'_DAIRA_INFO','D'+dairaNum+'_DAIRA_CONFIG','D32_DAIRA_INFO','D32_DAIRA_CONFIG','D32_CIRCLE','D32_CONFIG'];
  // 1) localStorage (نفس الصفحة + parent)
  try{
    var storages = [localStorage];
    try{ if(window.parent && window.parent!==window && window.parent.localStorage) storages.push(window.parent.localStorage); }catch(e){}
    for(var si=0; si<storages.length; si++){
      for(var ki=0; ki<keys.length; ki++){
        try{
          var raw = storages[si].getItem(keys[ki]) || storages[si].getItem('DAIRA_INFO_'+dairaNum) || storages[si].getItem('daira_info');
          if(raw){
            var norm = normalizeDairaInfo(raw, dairaNum);
            if(norm && (norm.list.length>0 || norm.neyaba || norm.amin)){
              DAIRA_CACHE = norm;
              return DAIRA_CACHE;
            }
          }
        }catch(e){}
      }
    }
  }catch(e){}
  // 2) IndexedDB - كل المفاتيح
  try{
    let db=await openDB();
    let tx=db.transaction('d32store','readonly');
    for(var k=0;k<keys.length;k++){
      try{
        let rq=tx.objectStore('d32store').get(keys[k]);
        let val=await new Promise(r=>{rq.onsuccess=()=>r(rq.result); rq.onerror=()=>r(null);});
        if(val){
          var norm2 = normalizeDairaInfo(val, dairaNum);
          if(norm2 && (norm2.list.length>0 || norm2.neyaba || norm2.amin)){
            DAIRA_CACHE = norm2;
            return DAIRA_CACHE;
          }
        }
      }catch(e){}
    }
  }catch(e){}
  // 3) Drive - لو مفيش محلي، جيب من السيرفر
  try{
    var url='https://script.google.com/macros/s/AKfycbwOTKlstkN7iqYr9IX_CM43EKs6ViBDpMcNJH7s3tU-52LCRIQAFjbI7sx_AD240A/exec?action=get&daira='+dairaNum;
    var res=await fetch(url,{cache:'no-store'});
    var txt=await res.text();
    var j=JSON.parse(txt);
    if(Array.isArray(j)) j={v3:j,ahkam:[]};
    var info=j.dairaInfo||j.dairaConfig||null;
    if(info){
      var norm3 = normalizeDairaInfo(info, dairaNum);
      if(norm3 && (norm3.list.length>0 || norm3.neyaba || norm3.amin)){
        DAIRA_CACHE = norm3;
        // خزنها محلي عشان بعد كده
        try{ localStorage.setItem('D'+dairaNum+'_DAIRA_INFO', JSON.stringify(info)); }catch(e){}
        return DAIRA_CACHE;
      }
    }
  }catch(e){}
  return {num:dairaNum,list:[],j1:'',j2:'',j3:'',j4:'',j5:'',j6:'',j7:'',neyaba:'',amin:''};
}
// لما بيانات الدائرة تتعدل من صفحة بيانات الدائرة، حدث المحضر فورا
window.addEventListener('message', function(e){
  if(e.data && (e.data.type==='DAIRA_INFO_REFRESH' || e.data.type==='D32_DAIRA_INFO_UPDATED' || e.data.type==='D32_CIRCLE_UPDATED')){
    DAIRA_CACHE = null;
    TEMP_HAYA = null;
    var incoming = e.data.data || e.data.info;
    if(incoming){
      var norm = normalizeDairaInfo(incoming, getCurrentDairaNum());
      if(norm) DAIRA_CACHE = norm;
    }
    renderMahdar();
  }
});
let mahaderList=[];let mahaderIdx=0;

async function buildMahdarHTML(ap, idx){
  var info=await getDaira();
  var inputVal=document.getElementById('mhDate').value;
  var dayName = '';
  if(inputVal){ try{ var dt = new Date(inputVal + 'T12:00:00'); var weekDays = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']; dayName = weekDays[dt.getDay()]; }catch(e){}}
  var dateDisplay=inputVal? toArabicNum(inputVal.split('-')[0]+'/'+inputVal.split('-')[1]+'/'+inputVal.split('-')[2]) : '';
  var rs;
  if(!ap){ rs='........ /........'; }
  else {
    var list=[(ap.raqm||'........')+' / '+(ap.sana||'........')];
    if(ap.dammList && ap.dammList.length){
      var seen={};
      seen[(ap.raqm||'')+'/'+(ap.sana||'')]=true;
      ap.dammList.forEach(function(d){
        var key=(d.raqm||'')+'/'+(d.sana||'');
        if(!seen[key]){ seen[key]=true; list.push((d.raqm||'........')+' / '+(d.sana||'........')); }
      });
    }
    rs=list.map(function(s){return toArabicNum(s);}).join('<br><div style="width:70px;height:1.5px;background:#000;margin:3px auto"></div>');
  }
  var m1 = ap? (ap.mostanef||'........') : '........';
var m2 = ap? (ap.ded||'........') : '........';
var isTatliq = false;
if(ap){
  for(var kk in ap){
    var vv = String(ap[kk]||'').trim();
    if(vv.indexOf('تطليق')===0){ isTatliq = true; break; }
  }
}
var tawkeelNum = ap ? (ap.tawkeel||ap.tawkeelMostanef||ap.tawkeelNo||'').trim() : '';
var tawkeelHTML = tawkeelNum ? `<span style="min-width:130px;text-align:center;padding:0 8px;flex:1;font-size:16px;font-weight:normal;border:none;outline:none">${tawkeelNum}</span>` : `<span class="dots"></span>`;
var curYear=getCurrentYearLogic();
var dairaAr=toArabicNum(info.num);

  let hayaHTML = '';
  let judges = info.list.filter(n=>n.trim()!='');
  if(judges.length > 0){
    hayaHTML += `<div class="haya-line"><span>برئاسة السيد الأستاذ المستشار /</span><span class="haya-name" style="font-size:18px">${judges[0]}</span><span>رئيس المحكمة</span></div>`;
    if(judges.length > 1){
      let otherJudges = judges.slice(1);
      if(otherJudges.length <= 3){
        let namesStr = otherJudges.join(' و/ ');
        hayaHTML += `<div class="haya-line"><span>وعضوية السادة القضاة /</span><span class="haya-name">${namesStr}</span><span>الرؤساء بالمحكمة</span></div>`;
      }else{
        let first3 = otherJudges.slice(0,3).join(' و/ ');
        let rest = otherJudges.slice(3).join(' و/ ');
        hayaHTML += `<div class="haya-line"><span>وعضوية السادة القضاة /</span><span class="haya-name">${first3} و/ </span><span></span></div>`;
        hayaHTML += `<div class="haya-line"><span></span><span class="haya-name">${rest}</span><span>الرؤساء بالمحكمة</span></div>`;
      }
    }
  }else{
    hayaHTML += `<div class="haya-line"><span>برئاسة السيد الأستاذ المستشار /</span><span class="haya-name" style="font-size:18px"></span><span>رئيس المحكمة</span></div>`;
    hayaHTML += `<div class="haya-line"><span>وعضوية السادة القضاة /</span><span class="haya-name"></span><span>الرؤساء بالمحكمة</span></div>`;
  }

  return `<div class="mahdar-page">
  <div style="text-align:center;font-weight:bold;border-bottom:1.5px solid #000;padding-bottom:4px;margin-bottom:4px;font-size:14px">
    <div style="display:flex;justify-content:space-between"><span>محكمة استئناف القاهرة</span><span>محضر جلسة الدائرة ${dairaAr} أحوال</span><span>${toArabicNum((idx||0)+1)} : رول</span></div>
    <div style="display:flex;justify-content:space-between"><span>مأمورية القاهرة الجديدة</span><span>${dateDisplay? dayName + ' الموافق '+dateDisplay :''}</span><span>أحوال</span></div>
  </div>
  <div class="galsa-line">${dateDisplay? 'بالجلسة المنعقدة علنا بسرايا المحكمة في يوم '+dayName+' الموافق '+dateDisplay :''}</div>
  ${hayaHTML}
  <div class="haya-line"><span>وحضور السيد الأستاذ /</span><span class="haya-name">${info.neyaba}</span><span>رئيس النيابة</span></div>
  <div class="haya-line"><span>وحضور السيد /</span><span class="haya-name">${info.amin}</span><span>أمين السر</span></div>

  <div style="text-align:center;margin:8px 0 4px;font-weight:bold;font-size:16px">في الاستئناف رقم <span style="display:inline-block;min-width:190px;letter-spacing:1.5px;padding-right:10px">${rs}</span></div>
  <div style="font-size:16px;text-align:center;display:flex;justify-content:center;align-items:center;gap:10px">
    <span>المرفوع من :</span>
    <b style="display:inline-block;min-width:140px;max-width:260px;text-align:center">${m1}</b>
    <span style="margin:0 12px">ضد</span>
    <b style="display:inline-block;min-width:140px;max-width:260px;text-align:center">${m2}</b>
  </div>

  <div style="margin-top:10px">
    <div class="hodor-row"><span>يحضر عن المستأنف أ/.</span><span class="dots"></span><span>توكيل</span>${tawkeelHTML}</div>
    <div class="hodor-row"><span>وقدم /.</span><span class="dots"></span></div>
    <div class="hodor-row" style="margin-bottom:8px"><span>وطلب /.</span><span class="dots"></span></div>
    <div class="empty-dots"></div><div class="empty-dots"></div><div class="empty-dots"></div><div class="empty-dots"></div><div class="empty-dots"></div><div class="empty-dots"></div>
  </div>
  <div style="margin-top:6px">
    <div class="hodor-row"><span>يحضر عن المستأنف ضده أ/.</span><span class="dots"></span><span>توكيل</span><span class="dots"></span></div>
    <div class="hodor-row"><span>وقدم /.</span><span class="dots"></span></div>
    <div class="hodor-row" style="margin-bottom:8px"><span>وطلب /.</span><span class="dots"></span></div>
    <div class="empty-dots"></div><div class="empty-dots"></div><div class="empty-dots"></div><div class="empty-dots"></div><div class="empty-dots"></div><div class="empty-dots"></div>
  </div>
    <div class="footer-block">
    ${isTatliq ? '<div class="hodor-row" style="margin-bottom:10px"><span style="font-weight:bold">المحكمة عرضت الصلح</span><span class="dots"></span></div>' : '<div class="empty-dots" style="margin-bottom:10px"></div>'}
    <div style="text-align:center; font-size:16px; margin-bottom:10px;">المحكمة</div>
    <div class="hodor-row" style="margin-bottom:10px"><span>لجلسة</span><span style="margin:0 8px; letter-spacing:3px;"> &nbsp; / &nbsp; &nbsp; / ${curYear}</span><span class="dots"></span></div>
    <div style="display:flex;justify-content:space-between;font-weight:bold;font-size:16px; margin-top:12px; padding:0 30px; box-sizing:border-box;">
      <span>أمين السر</span><span>رئيس المحكمة</span>
    </div>
  </div>
</div>`;
}
async function renderMahdar(){var ap=mahaderList[mahaderIdx]||null; document.getElementById('mhDisplay').innerHTML=await buildMahdarHTML(ap, mahaderIdx); document.getElementById('mhNavInfo').textContent=mahaderList.length? 'رول '+(mahaderIdx+1)+' من '+mahaderList.length:'نموذج';document.getElementById('mhPrintCount').textContent=mahaderList.length||0;}
function getCasesForDate(s){
  var t=parseDateStr(s); if(!t) return[]; var seen={}; var list=[];
  DATA.forEach((ap, fileIdx)=>{
    if(ap.tarikhHokm && datesEqual(ap.tarikhHokm, t.str)) return;
    if(ap.dammTo){ if(!ap.dammDate||!datesEqual(ap.dammDate,t.str)) return; }
    var matched=false; var jMatched=null;
    if(ap.jalsat){ for(var k=0;k<ap.jalsat.length;k++){ var j=ap.jalsat[k]; if(j.isMahgoz) continue; var pd=parseDateStr(j.tarikh); if(pd&&datesEqual(pd.str,t.str)){ matched=true; jMatched=j; break; } } }
    var b=ap.galsaAsasia||''; if(!matched && b && datesEqual(b,t.str)){ matched=true; jMatched=ap.jalsat.find(x=>datesEqual(x.tarikh,t.str))||{tarikh:t.str,qarar:'',ta2gil:ap.galsaQadima||'',halat:ap.halat||'متداول'}; }
    if(matched){ var key=ap.raqm+''+ap.sana+''+t.str; if(!seen[key]){ seen[key]=true; var order; if(ap._seq!=null && ap._seq<900000){ order=ap._seq; }else if(ap._manualOrder!=null && ap._manualOrder<900000){ order=ap._manualOrder; }else if(ap._sessionOrder!=null && ap._sessionOrder<900000){ order=ap._sessionOrder; }else if(ap._fileIndex!=null){ order=ap._fileIndex; }else{ order=fileIdx; } list.push({ap:ap,j:jMatched,apId:ap.id,fileOrder:order}); } }
  });
  list.sort((a,b)=>(a.fileOrder||0)-(b.fileOrder||0)); return list;
}

function getCasesForDate_OrderedList(s){
  var rawList=getCasesForDate(s);
  if(!rawList.length) return [];
  var motadawel=[], tahqiq=[];
  rawList.forEach(o=>{
    var ap=o.ap||{}; var j=o.j||{};
    var halatSession = String((j.halat||j.hala||'')).toLowerCase();
    var qararSession = String((j.qarar||'')).toLowerCase();
    var isTahqiqSession = halatSession.indexOf('تحقيق')>-1 || qararSession.indexOf('تحقيق')>-1;
    if(isTahqiqSession){ tahqiq.push(o); } else { motadawel.push(o); }
  });
  motadawel.sort((a,b)=>(a.fileOrder||0)-(b.fileOrder||0));
  tahqiq.sort((a,b)=> (a.ap._fileIndex||0)-(b.ap._fileIndex||0));
  return [...motadawel,...tahqiq];
}

async function searchMahader(){
  TEMP_HAYA=null;
  DAIRA_CACHE=null;
  await loadData();
  var input=document.getElementById('mhDate').value;
  if(!input){alert('اختار التاريخ');return;}
  var p=input.split('-');
  var target=p[0]+'/'+p[1]+'/'+p[2];
  var resObjs=getCasesForDate_OrderedList(target);
  var res=resObjs.map(o=>o.ap);
  mahaderList=res;mahaderIdx=0;
  document.getElementById('mhCount').textContent=res.length?'يوجد '+res.length+' رولات':'فارغ';
  renderMahdar();
}
function mhPrev(){if(mahaderIdx>0){mahaderIdx--;renderMahdar();}}
function mhNext(){if(mahaderIdx<mahaderList.length-1){mahaderIdx++;renderMahdar();}}
function printCurrentMahdar(){window.print();}
async function printAllMahader(){
  if(!mahaderList.length){window.print();return;}
  var all='';
  for(let i=0;i<mahaderList.length;i++){
    var html = await buildMahdarHTML(mahaderList[i],i);
    all += html;
  }
  var orig=document.getElementById('mhDisplay').innerHTML;
  var display=document.getElementById('mhDisplay');
  display.innerHTML=all;
  setTimeout(()=>{
    window.print();
    setTimeout(()=>{ display.innerHTML=orig; },800);
  },300);
}
