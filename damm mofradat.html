<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<script src="daira-core.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>د32 - ورود المفردات - نهائي عربي + آخر جلسة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma}
body{background:#0e1627;direction:rtl;padding:8px}
header{background:#0f1f3a;color:#ffd966;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.card{background:#fff;padding:10px;border-radius:10px;margin-top:8px}
.btn{padding:8px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:12px}
.btn-navy{background:#0A2342;color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-gold{background:#C9A227;color:#000}.btn-small{background:#0A2342;color:#fff;padding:5px 8px;font-size:11px;border-radius:6px}
.input{padding:7px;border:2px solid #999;border-radius:6px;text-align:center;font-weight:bold;width:100%;font-size:13px}
.table-wrap{overflow:auto;max-height:75vh;border:2px solid #0A2342;border-radius:8px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{position:sticky;top:0;background:#0A2342;color:#ffd966;padding:8px 4px;font-size:11px;border:1px solid #000}
td{padding:4px;border:1px solid #ccc;text-align:center;font-size:12px;height:48px}
td.filled{background:#e8f5e9}td.missing{background:#ffebee}td.original{background:#d1fae5;border:2px solid #16a34a}
td.linked{background:#fef3c7;border:2px solid #C9A227}td.shatb{background:#ffebee;border:2px solid #b00020}
.badge{padding:3px 8px;border-radius:12px;font-weight:bold;font-size:11px;display:inline-block}
.badge-warradat{background:#16a34a;color:#fff}.badge-lamtard{background:#b00020;color:#fff}.badge-linked{background:#C9A227;color:#000}.badge-shatb{background:#616161;color:#fff}
.row-num{background:#FFE4B5;font-weight:bold}
</style>
</head>
<body>
<header>
<div>📦 ورود المفردات - آخر جلسة أساسية | <span id="cntInfo">جاري...</span></div>
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="btn btn-green" onclick="applyAll()">✅ تطبيق الكل المحدد</button>
<button class="btn btn-gold" onclick="addRows(10)">➕ صفوف</button>
<button class="btn btn-navy" onclick="loadFromDB()">🔄 تحديث</button>
<span id="log" style="color:#fff;font-weight:bold"></span>
</div>
</header>

<div class="card" style="background:#fffbe6;border:2px solid #0A2342;line-height:1.9">
<b>التعديل في آخر جلسة أساسية فقط (galsaAsasia الأخيرة):</b> جلسة ٥/٩ تفضل <span class="badge badge-lamtard">لم ترد</span> وجلسة ٥/١٠ تبقى <span class="badge badge-warradat">وردت</span> | الأرقام كلها بالعربي ٠١٢٣٤٥٦٧٨٩
</div>

<div class="card" style="padding:0">
<div class="table-wrap">
<table>
<thead>
<tr>
<th style="width:30px">م</th>
<th style="width:75px">رقم استئناف</th>
<th style="width:55px">سنة</th>
<th style="width:65px">جزئي</th>
<th style="width:50px">س.جزئي</th>
<th style="width:80px">المحكمة</th>
<th style="width:60px">الحالة</th>
<th style="width:85px">آخر أساسية</th>
<th style="width:75px">الحالي</th>
<th style="width:115px">بعد التطبيق</th>
<th style="width:35px">✓</th>
<th style="width:65px">تطبيق</th>
</tr>
</thead>
<tbody id="bulkBody"></tbody>
</table>
</div>
</div>

<script>
const DB_NAME='D32_DB';
var DATA=[];
function toAr(n){return String(n==null?'':n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
function toArText(s){return String(s==null?'':s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
function toEn(s){return String(s||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[^0-9]/g,'');}
function cleanDate(s){if(!s)return'';s=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/-/g,'/').trim();var m=s.match(/\d+/g);if(!m||m.length<3)return'';var d,mo,ye;if(m[0].length==4){ye=m[0];mo=m[1];d=m[2];}else{d=m[0];mo=m[1];ye=m[2];if(ye.length==2)ye='20'+ye;}return ye+'/'+String(mo).padStart(2,'0')+'/'+String(d).padStart(2,'0');}
function parseDateStr(s){var cd=cleanDate(s);if(!cd)return null;var p=cd.split('/');return{str:cd,y:parseInt(p[0]),mo:parseInt(p[1]),d:parseInt(p[2])};}
function datesEqual(a,b){a=cleanDate(a);b=cleanDate(b);if(!a||!b)return false;return a===b;}
function displayMof(m){m=String(m||'').trim();if(m==='مطلوبة'||m==='مطلوب') return 'لم ترد'; if(!m) return ''; return m;}
function normalizeAwal(s){return String(s||'').trim().replace(/\s+/g,'').replace(/[\.،,]/g,'');}
function getGroupKey(ap){return normalizeAwal(ap.raqmAwal||'')+'|'+normalizeAwal(ap.sanaAwal||'')+'|'+normalizeAwal(ap.mahkama||'');}

function isShatb(ap){
  if(!ap) return false;
  let halat=String(ap.halat||ap.hala||'').trim();
  if(halat.indexOf('شطب')>-1) return true;
  let qarar=String(ap.qarar||ap.qar||'').trim();
  if(qarar.indexOf('شطب')>-1) return true;
  if(ap.jalsat){
    for(let j of ap.jalsat){
      let q=String(j.qarar||'').trim();
      let h=String(j.halat||j.hala||'').trim();
      if(q.indexOf('شطب')>-1 || h.indexOf('شطب')>-1) return true;
    }
  }
  if(ap.tarikhHokm && String(ap.qararHokm||'').indexOf('شطب')>-1) return true;
  return false;
}
function isMotadawel(ap){ return !isShatb(ap); }

function openDB(){
  return new Promise((res,rej)=>{
    let r=indexedDB.open(DB_NAME,2);
    r.onupgradeneeded=e=>{
      let db=e.target.result;
      if(!db.objectStoreNames.contains('cases')) db.createObjectStore('cases');
      if(!db.objectStoreNames.contains('ahkam')) db.createObjectStore('ahkam');
      if(!db.objectStoreNames.contains('d32store')) db.createObjectStore('d32store');
    };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function loadFromDB(){
  document.getElementById('cntInfo').textContent='📡 تحميل...';
  try{
    let db=await openDB();
    let tx=db.transaction(['cases'],'readonly');
    let req=tx.objectStore('cases').get('D32_V3');
    let result=await new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});
    if(result){
      let a=JSON.parse(result);
      if(Array.isArray(a)&&Array.isArray(a[1])) a=a[1];
      DATA=a.map((x,i)=>{
        if(x._fileIndex==null) x._fileIndex=i;
        if(x._seq==null) x._seq=x._fileIndex;
        x.id=x.id||i+1;
        if(!x.jalsat) x.jalsat=[];
        return x;
      });
      document.getElementById('cntInfo').textContent='القاعدة: '+toAr(DATA.length)+' قضية';
      refreshAllRows();
    }
  }catch(e){document.getElementById('cntInfo').textContent='خطأ: '+e.message;}
}

// آخر جلسة أساسية = أكبر تاريخ galsaAsasia + أحدث _updatedAt
function getLastAsasiaSession(raqm,sana){
  raqm=toEn(raqm); sana=toEn(sana);
  if(!raqm||!sana) return null;
  let candidates=DATA.filter(ap=> toEn(ap.raqm)===raqm && toEn(ap.sana)===sana && !ap.dammTo);
  if(!candidates.length) return null;
  candidates.sort((a,b)=>{
    let da=parseDateStr(a.galsaAsasia||''); let db=parseDateStr(b.galsaAsasia||'');
    let ta=da? new Date(da.y,da.mo-1,da.d).getTime():0;
    let tb=db? new Date(db.y,db.mo-1,db.d).getTime():0;
    if(tb!==ta) return tb-ta; // الأحدث تاريخا أولا
    return (b._updatedAt||0)-(a._updatedAt||0);
  });
  return candidates[0]; // آخر جلسة أساسية
}

function distinctAppealsByKey(key){
  let list=DATA.filter(ap=> getGroupKey(ap)===key && normalizeAwal(ap.raqmAwal));
  let map={};
  list.forEach(ap=>{
    let k=toEn(ap.raqm)+'|'+toEn(ap.sana);
    if(!map[k] || (ap._updatedAt||0)>(map[k]._updatedAt||0)) map[k]=ap;
  });
  return Object.values(map);
}
function findOriginalAndEffective(distinctList){
  if(!distinctList.length) return {trueOriginal:null, effectiveOriginal:null, sorted:[]};
  let sorted=distinctList.slice().sort((a,b)=>{
    let sa=parseInt(toEn(a.sana)||0), sb=parseInt(toEn(b.sana)||0);
    if(sa!==sb) return sa-sb;
    let ra=parseInt(toEn(a.raqm)||0), rb=parseInt(toEn(b.raqm)||0);
    return ra-rb;
  });
  let trueOriginal=sorted[0];
  let effectiveOriginal=sorted.find(ap=> isMotadawel(getLastAsasiaSession(ap.raqm, ap.sana) || ap) ) || null;
  if(!effectiveOriginal) effectiveOriginal=trueOriginal;
  return {trueOriginal, effectiveOriginal, sorted};
}

function handleRaqmEnter(e, idx){
  if(e.key==='Enter'){
    e.preventDefault();
    lookup(idx);
    let sEl=document.getElementById('s-'+idx);
    if(sEl){ sEl.focus(); sEl.select(); }
  }
}
function handleSanaEnter(e, idx){
  if(e.key==='Enter'){
    e.preventDefault();
    lookup(idx);
    let nextIdx=idx+1;
    let tbody=document.getElementById('bulkBody');
    if(nextIdx>=tbody.children.length) addRows(1);
    setTimeout(()=>{
      let rEl=document.getElementById('r-'+nextIdx);
      if(rEl){ rEl.focus(); rEl.select(); }
    },30);
  }
}

function createRow(idx){
  let tr=document.createElement('tr');
  tr.id='row-'+idx;
  tr.innerHTML=`
<td class="row-num">${toAr(idx+1)}</td>
<td><input class="input" id="r-${idx}" placeholder="رقم" onblur="lookup(${idx})" onkeydown="handleRaqmEnter(event, ${idx})"></td>
<td><input class="input" id="s-${idx}" placeholder="سنة" onblur="lookup(${idx})" onkeydown="handleSanaEnter(event, ${idx})"></td>
<td id="ra-${idx}" class="missing">-</td>
<td id="sa-${idx}" class="missing">-</td>
<td id="ma-${idx}" class="missing">-</td>
<td id="ha-${idx}" class="missing">-</td>
<td id="ga-${idx}" class="missing">-</td>
<td id="mf-${idx}">-</td>
<td id="after-${idx}">-</td>
<td><input type="checkbox" id="ch-${idx}" style="width:20px;height:20px"></td>
<td><button class="btn-small" onclick="applySingle(${idx})">تطبيق</button></td>
`;
  return tr;
}
function renderRows(n){
  let tbody=document.getElementById('bulkBody');
  tbody.innerHTML='';
  for(let i=0;i<n;i++) tbody.appendChild(createRow(i));
}
function addRows(n){
  let tbody=document.getElementById('bulkBody');
  let cur=tbody.children.length;
  for(let i=cur;i<cur+n;i++) tbody.appendChild(createRow(i));
}

function lookup(idx){
  let raqm=document.getElementById('r-'+idx).value.trim();
  let sana=document.getElementById('s-'+idx).value.trim();
  if(!raqm||!sana) return;
  let found=getLastAsasiaSession(raqm,sana);
  if(!found){
    document.getElementById('ra-'+idx).textContent='غير موجود';
    document.getElementById('ra-'+idx).className='missing';
    return;
  }
  document.getElementById('ra-'+idx).textContent=toArText(found.raqmAwal||'-');
  document.getElementById('sa-'+idx).textContent=toArText(found.sanaAwal||'-');
  document.getElementById('ma-'+idx).textContent=found.mahkama||'-';
  document.getElementById('ga-'+idx).textContent=toArText(found.galsaAsasia||'-');
  let isSh=isShatb(found);
  document.getElementById('ha-'+idx).innerHTML=isSh?'<span class="badge badge-shatb">مشطوب</span>':'<span class="badge badge-warradat" style="background:#0A2342">متداول</span>';
  document.getElementById('ra-'+idx).className='filled';
  document.getElementById('sa-'+idx).className='filled';
  document.getElementById('ma-'+idx).className='filled';
  document.getElementById('ga-'+idx).className='filled';
  document.getElementById('ha-'+idx).className=isSh?'shatb':'filled';

  let mf=displayMof(found.mofradat||found.mof||'');
  document.getElementById('mf-'+idx).innerHTML=mf ? '<span class="badge '+(mf==='وردت'?'badge-warradat':mf.indexOf('وردت في')>-1?'badge-linked':'badge-lamtard')+'">'+mf+'</span>' : '-';
  document.getElementById('mf-'+idx).dataset.apId=found.id;

  let key=getGroupKey(found);
  let distinct=distinctAppealsByKey(key);
  let {trueOriginal, effectiveOriginal}=findOriginalAndEffective(distinct);
  let afterText='';
  let afterClass='filled';
  if(effectiveOriginal){
    if(toEn(found.raqm)===toEn(effectiveOriginal.raqm) && toEn(found.sana)===toEn(effectiveOriginal.sana)){
      afterText='<span class="badge badge-warradat">وردت</span>';
      afterClass='original';
    }else{
      afterText='<span class="badge badge-linked">وردت في الاستئناف '+toArText(effectiveOriginal.raqm)+' / '+toArText(effectiveOriginal.sana)+'</span>';
      afterClass='linked';
    }
    if(trueOriginal && effectiveOriginal && (toEn(trueOriginal.raqm)!==toEn(effectiveOriginal.raqm) || toEn(trueOriginal.sana)!==toEn(effectiveOriginal.sana))){
      afterText+='<br><small style="color:#b00020">الأصلي '+toArText(trueOriginal.raqm)+'/'+toArText(trueOriginal.sana)+' مشطوب</small>';
    }
  }else{
    afterText='<span class="badge badge-warradat">وردت</span>';
  }
  document.getElementById('after-'+idx).innerHTML=afterText;
  document.getElementById('after-'+idx).className=afterClass;
  if(mf==='لم ترد' || mf==='') document.getElementById('ch-'+idx).checked=true;
}

function refreshAllRows(){
  let tbody=document.getElementById('bulkBody');
  for(let i=0;i<tbody.children.length;i++) lookup(i);
}

async function saveToDB(){
  let db=await openDB();
  let tx=db.transaction(['cases'],'readwrite');
  tx.objectStore('cases').put(JSON.stringify(DATA),'D32_V3');
  await new Promise((res,rej)=>{tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);});
}

async function applySingle(idx){
  let apId=document.getElementById('mf-'+idx)?.dataset?.apId;
  if(!apId){alert('اكتب الرقم والسنة أولا');return;}
  let ap=DATA.find(x=>String(x.id)===String(apId));
  if(!ap) return;
  let key=getGroupKey(ap);
  let distinct=distinctAppealsByKey(key);
  let {trueOriginal, effectiveOriginal}=findOriginalAndEffective(distinct);
  if(!effectiveOriginal) effectiveOriginal=ap;

  let updates=[];
  let effLatest=getLastAsasiaSession(effectiveOriginal.raqm, effectiveOriginal.sana);
  if(effLatest){
    effLatest.mofradat='وردت'; effLatest.mof='وردت'; effLatest._updatedAt=Date.now();
    updates.push(effLatest);
  }
  if(toEn(ap.raqm)!==toEn(effectiveOriginal.raqm) || toEn(ap.sana)!==toEn(effectiveOriginal.sana)){
    let targetLatest=getLastAsasiaSession(ap.raqm, ap.sana);
    if(targetLatest){
      targetLatest.mofradat='وردت في الاستئناف '+effectiveOriginal.raqm+' / '+effectiveOriginal.sana;
      targetLatest.mof=targetLatest.mofradat;
      targetLatest._updatedAt=Date.now();
      updates.push(targetLatest);
    }
  }
  // لو الأصلي الحقيقي مشطوب واخترنا واحد تاني، حدثه هو كمان
  if(trueOriginal && effectiveOriginal && (toEn(trueOriginal.raqm)!==toEn(effectiveOriginal.raqm) || toEn(trueOriginal.sana)!==toEn(effectiveOriginal.sana))){
    let trueLatest=getLastAsasiaSession(trueOriginal.raqm, trueOriginal.sana);
    if(trueLatest && !updates.find(u=>u.id===trueLatest.id)){
      trueLatest.mofradat='وردت في الاستئناف '+effectiveOriginal.raqm+' / '+effectiveOriginal.sana;
      trueLatest.mof=trueLatest.mofradat;
      trueLatest._updatedAt=Date.now();
      updates.push(trueLatest);
    }
  }

  await saveToDB();
  document.getElementById('log').textContent='✅ تم تطبيق صف '+toAr(idx+1);
  lookup(idx);
  // حدث كل الصفوف المرتبطة بنفس الجزئي
  refreshAllRows();
}

async function applyAll(){
  let tbody=document.getElementById('bulkBody');
  let checked=[];
  for(let i=0;i<tbody.children.length;i++){
    if(!document.getElementById('ch-'+i).checked) continue;
    let apId=document.getElementById('mf-'+i).dataset.apId;
    if(!apId) continue;
    let ap=DATA.find(x=>String(x.id)===String(apId));
    if(ap) checked.push(ap);
  }
  if(!checked.length){alert('مفيش حاجة محددة');return;}

  let groups={};
  checked.forEach(ap=>{
    let key=getGroupKey(ap);
    if(!key || key==='||') return;
    if(!groups[key]) groups[key]=[];
    groups[key].push(ap);
  });

  let updates=[];
  let logLines=[];
  for(let key in groups){
    let distinct=distinctAppealsByKey(key);
    let {trueOriginal, effectiveOriginal}=findOriginalAndEffective(distinct);
    if(!effectiveOriginal) continue;
    let effLatest=getLastAsasiaSession(effectiveOriginal.raqm, effectiveOriginal.sana);
    if(effLatest){
      effLatest.mofradat='وردت'; effLatest.mof='وردت'; effLatest._updatedAt=Date.now();
      updates.push(effLatest);
      logLines.push('متداول فعّال '+toArText(effLatest.raqm)+'/'+toArText(effLatest.sana)+' → وردت' + (trueOriginal && toEn(trueOriginal.raqm)!==toEn(effectiveOriginal.raqm) ? ' (الأصلي '+toArText(trueOriginal.raqm)+'/'+toArText(trueOriginal.sana)+' مشطوب)' : ''));
    }
    distinct.forEach(apItem=>{
      let latest=getLastAsasiaSession(apItem.raqm, apItem.sana);
      if(!latest) return;
      if(toEn(latest.raqm)===toEn(effectiveOriginal.raqm) && toEn(latest.sana)===toEn(effectiveOriginal.sana)) return;
      latest.mofradat='وردت في الاستئناف '+effectiveOriginal.raqm+' / '+effectiveOriginal.sana;
      latest.mof=latest.mofradat;
      latest._updatedAt=Date.now();
      updates.push(latest);
      logLines.push((isShatb(latest)?'مشطوب ':'مرتبط ')+toArText(latest.raqm)+'/'+toArText(latest.sana)+' → '+latest.mofradat);
    });
  }

  let uniq={}; let finalUpdates=[];
  updates.forEach(ap=>{ if(!uniq[ap.id]){ uniq[ap.id]=true; finalUpdates.push(ap);} });

  if(!confirm('سيتم تطبيق في آخر جلسة أساسية:\n'+logLines.join('\n')+'\n\nعدد: '+toAr(finalUpdates.length)+' جلسة\nتأكيد؟')) return;

  await saveToDB();
  document.getElementById('log').textContent='✅ تم: '+toAr(finalUpdates.length);
  alert('✅ تم الحفظ في آخر جلسة أساسية:\n'+logLines.join('\n'));
  refreshAllRows();
}

renderRows(15);
loadFromDB();
</script>
</body>
</html>
