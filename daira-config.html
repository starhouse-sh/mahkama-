<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بيانات الدائرة</title>
<style>
*{box-sizing:border-box;font-family:Tahoma}
body{background:#f5f5f5;padding:12px;direction:rtl;margin:0}
.card{background:#fff;border-radius:14px;padding:18px;max-width:700px;margin:10px auto;box-shadow:0 2px 12px rgba(0,0,0,.1)}
h2{text-align:center;color:#0A2342;margin:0 0 16px;font-size:18px}
label{display:block;margin:12px 0 5px;font-weight:bold;font-size:13px;color:#0A2342}
input,select,textarea{width:100%;padding:11px;border:1.5px solid #ccc;border-radius:8px;font-size:14px;background:#fff}
textarea{height:60px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){ .row{grid-template-columns:1fr} }
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:18px;font-size:15px;background:#0A2342;color:#FFD700}
.btn:disabled{opacity:.6}
.daira-num{font-size:20px;color:#FFD700;background:#0A2342;display:inline-block;padding:6px 16px;border-radius:20px}
</style>
</head>
<body>
<div class="card">
<h2>بيانات الدائرة <span class="daira-num" id="dNum"></span></h2>

<label>رقم الدائرة</label>
<input id="dairaNumber" type="text" readonly style="background:#f0f2f5;text-align:center;font-weight:bold">

<div class="row">
<div>
<label>دور الانعقاد</label>
<select id="dawr">
<option value="">اختر</option>
<option value="الأسبوع الأول">الأسبوع الأول</option>
<option value="الأسبوع الثاني">الأسبوع الثاني</option>
<option value="الأسبوع الثالث">الأسبوع الثالث</option>
<option value="الأسبوع الرابع">الأسبوع الرابع</option>
</select>
</div>
<div>
<label>فترة الانعقاد</label>
<select id="fatra">
<option value="">اختر</option>
<option value="صباحي">صباحي</option>
<option value="مسائي">مسائي</option>
</select>
</div>
</div>

<label>رئيس الدائرة</label>
<input id="raees" type="text">

<label>العضو الثاني</label>
<input id="odw2" type="text">

<label>العضو الثالث</label>
<input id="odw3" type="text">

<label>العضو الرابع</label>
<input id="odw4" type="text">

<label>العضو الخامس</label>
<input id="odw5" type="text">

<label>العضو السادس</label>
<input id="odw6" type="text">

<label>العضو السابع</label>
<input id="odw7" type="text">

<label>اسم رئيس النيابة</label>
<input id="raeesNiyaba" type="text">

<label>اسم أمين السر</label>
<input id="ameenSerr" type="text">

<button class="btn" id="saveBtn" onclick="saveDaira()">حفظ بيانات الدائرة</button>
</div>

<script>
const CURRENT_DAIRA = localStorage.getItem('current_daira') || localStorage.getItem('DAIRA') || '32';
document.getElementById('dNum').textContent = CURRENT_DAIRA;
document.getElementById('dairaNumber').value = CURRENT_DAIRA;

const CLOUD_GET = 'https://script.google.com/macros/s/AKfycbwOTKlstkN7iqYr9IX_CM43EKs6ViBDpMcNJH7s3tU-52LCRIQAFjbI7sx_AD240A/exec?action=get&daira='+CURRENT_DAIRA;
const CLOUD_POST = 'https://script.google.com/macros/s/AKfycbwOTKlstkN7iqYr9IX_CM43EKs6ViBDpMcNJH7s3tU-52LCRIQAFjbI7sx_AD240A/exec?daira='+CURRENT_DAIRA;
const LS_KEY = 'D'+CURRENT_DAIRA+'_DAIRA_INFO';
const IDB_KEYS = ['D'+CURRENT_DAIRA+'_DAIRA_INFO','D'+CURRENT_DAIRA+'_DAIRA_CONFIG','D32_DAIRA_INFO','D32_DAIRA_CONFIG','D32_CIRCLE','D32_CONFIG'];

function openDB(){
  return new Promise((res,rej)=>{
    let r=indexedDB.open('D'+CURRENT_DAIRA+'_DB',2);
    r.onupgradeneeded=e=>{
      let db=e.target.result;
      try{
        if(!db.objectStoreNames.contains('cases'))db.createObjectStore('cases');
        if(!db.objectStoreNames.contains('ahkam'))db.createObjectStore('ahkam');
        if(!db.objectStoreNames.contains('d32store'))db.createObjectStore('d32store');
      }catch(err){}
    };
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
}
async function idbSet(k,v){
  let db=await openDB();
  return new Promise((rs,rj)=>{
    let tx=db.transaction('d32store','readwrite');
    tx.objectStore('d32store').put(v,k);
    tx.oncomplete=()=>rs();
    tx.onerror=e=>rj(e);
  });
}
async function idbGet(k){
  let db=await openDB();
  return new Promise((rs,rj)=>{
    let tx=db.transaction('d32store','readonly');
    let rq=tx.objectStore('d32store').get(k);
    rq.onsuccess=()=>rs(rq.result);
    rq.onerror=e=>rj(e);
  });
}

function getFormData(){
  const c = (id)=>{ let v=document.getElementById(id).value||''; v=v.toString().trim(); if(v==='[object Object]'||v.includes('[object Object]')) return ''; return v; };
  return {
    dairaNumber: CURRENT_DAIRA,
    num: CURRENT_DAIRA,
    dawr: c('dawr'),
    fatra: c('fatra'),
    raees: c('raees'),
    yameen: (document.getElementById('odw2').value||'').toString().trim().replace('[object Object]',''),
    shamal: (document.getElementById('odw3').value||'').toString().trim().replace('[object Object]',''),
    members: [c('raees'),c('odw2'),c('odw3'),c('odw4'),c('odw5'),c('odw6'),c('odw7')],
    odw2: c('odw2'),
    odw3: c('odw3'),
    odw4: c('odw4'),
    odw5: c('odw5'),
    odw6: c('odw6'),
    odw7: c('odw7'),
    raeesNiyaba: c('raeesNiyaba'),
    ameenSerr: c('ameenSerr'),
    ameen: document.getElementById('ameenSerr').value.trim(),
    _updatedAt: Date.now(),
    daira: CURRENT_DAIRA
  };
}

function cleanVal(v){
  if(v===null||v===undefined) return '';
  if(typeof v==='string'){
    if(v==='[object Object]'||v.includes('[object Object]')) return '';
    return v.trim();
  }
  if(typeof v==='object'){
    // لو اتحفظ كـ object بالغلط، حاول تطلع الاسم منه
    return (v.name||v.raees||v.text||v.value||'').toString().trim();
  }
  return String(v).trim();
}
function setFormData(d){
  if(!d) return;
  // نظف أي بيانات فاسدة فيها [object Object]
  if(d.dawr) document.getElementById('dawr').value = cleanVal(d.dawr);
  if(d.fatra) document.getElementById('fatra').value = cleanVal(d.fatra);
  
  let m = Array.isArray(d.members) ? d.members : [];
  document.getElementById('raees').value = cleanVal(d.raees) || cleanVal(m[0]) || '';
  
  if(m.length>=7){
    document.getElementById('odw2').value = cleanVal(m[1]);
    document.getElementById('odw3').value = cleanVal(m[2]);
    document.getElementById('odw4').value = cleanVal(m[3]);
    document.getElementById('odw5').value = cleanVal(m[4]);
    document.getElementById('odw6').value = cleanVal(m[5]);
    document.getElementById('odw7').value = cleanVal(m[6]);
  } else {
    document.getElementById('odw2').value = cleanVal(d.odw2) || cleanVal(d.yameen);
    document.getElementById('odw3').value = cleanVal(d.odw3) || cleanVal(d.shamal);
    document.getElementById('odw4').value = cleanVal(d.odw4);
    document.getElementById('odw5').value = cleanVal(d.odw5);
    document.getElementById('odw6').value = cleanVal(d.odw6);
    document.getElementById('odw7').value = cleanVal(d.odw7);
  }
  document.getElementById('raeesNiyaba').value = cleanVal(d.raeesNiyaba);
  document.getElementById('ameenSerr').value = cleanVal(d.ameenSerr) || cleanVal(d.ameen);
  
  // لو فيه خانات لسه فيها [object Object] بعد التحميل، فضيها فورا
  ['raees','odw2','odw3','odw4','odw5','odw6','odw7','raeesNiyaba','ameenSerr'].forEach(id=>{
    let el=document.getElementById(id);
    if(el && el.value.includes('[object Object]')) el.value='';
  });
}

async function saveLocalOnly(data){
  let str=JSON.stringify(data);
  try{ localStorage.setItem(LS_KEY, str); }catch(e){}
  try{ localStorage.setItem('DAIRA_INFO_'+CURRENT_DAIRA, str); }catch(e){}
  try{ localStorage.setItem('daira_info', str); }catch(e){}
  for(let k of IDB_KEYS){
    try{ await idbSet(k, str); }catch(e){}
  }
}

async function uploadToDrive(data){
  try{
    let curRes=await fetch(CLOUD_GET,{cache:'no-store'});
    let curTxt=await curRes.text();
    let cur={};
    try{ cur=JSON.parse(curTxt); }catch(e){ cur={v3:[],ahkam:[]}; }
    if(Array.isArray(cur)) cur={v3:cur,ahkam:[]};
    let payload={
      v3:cur.v3||[],
      ahkam:cur.ahkam||[],
      dairaInfo:data,
      dairaConfig:data,
      _password:cur._password||cur.password||localStorage.getItem('current_daira_pass')||'',
      _masterPassword:cur._masterPassword||localStorage.getItem('admin_master_password')||'Admin@2026',
      _updatedAt:Date.now()
    };
    await fetch(CLOUD_POST,{method:'POST',body:JSON.stringify(payload)});
    return true;
  }catch(e){ throw e; }
}

async function loadLocal(){
  let raw = localStorage.getItem(LS_KEY) || localStorage.getItem('DAIRA_INFO_'+CURRENT_DAIRA) || localStorage.getItem('daira_info');
  if(raw){
    try{ let d=JSON.parse(raw); setFormData(d); return true; }catch(e){}
  }
  for(let k of IDB_KEYS){
    try{
      let idbRaw=await idbGet(k);
      if(idbRaw){ let d=JSON.parse(idbRaw); setFormData(d); return true; }
    }catch(e){}
  }
  return false;
}

async function loadFromDriveSilent(){
  try{
    let res=await fetch(CLOUD_GET,{cache:'no-store'});
    let txt=await res.text();
    let j=JSON.parse(txt);
    if(Array.isArray(j)) j={v3:j,ahkam:[]};
    let info=j.dairaInfo||j.dairaConfig||null;
    if(info && Object.keys(info).length>0){
      setFormData(info);
      await saveLocalOnly(info);
      return true;
    }
  }catch(e){}
  return false;
}

async function saveDaira(){
  let btn=document.getElementById('saveBtn');
  btn.disabled=true;
  let data=getFormData();
  await saveLocalOnly(data);
  if(navigator.onLine){
    try{ await uploadToDrive(data); localStorage.removeItem('DAIRA_DIRTY_'+CURRENT_DAIRA); }catch(e){ localStorage.setItem('DAIRA_DIRTY_'+CURRENT_DAIRA,'1'); }
  } else {
    localStorage.setItem('DAIRA_DIRTY_'+CURRENT_DAIRA,'1');
  }
  btn.disabled=false;
  try{ parent.postMessage({type:'D32_DAIRA_INFO_UPDATED',data:data},'*'); }catch(e){}
  if(window.history.length>1){ try{ window.close(); }catch(e){} }
}

window.addEventListener('online', async ()=>{
  let dirty=localStorage.getItem('DAIRA_DIRTY_'+CURRENT_DAIRA);
  if(!dirty) return;
  try{
    let raw=localStorage.getItem(LS_KEY);
    if(!raw) return;
    let data=JSON.parse(raw);
    await uploadToDrive(data);
    localStorage.removeItem('DAIRA_DIRTY_'+CURRENT_DAIRA);
  }catch(e){}
});

(async()=>{
  await loadLocal();
  if(navigator.onLine){ await loadFromDriveSilent(); }
})();
</script>
</body>
</html>
