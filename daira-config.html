<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بيانات الدائرة - FIXED SYNC</title>
<style>
*{box-sizing:border-box;font-family:Tahoma}
body{background:#f5f5f5;padding:12px;direction:rtl}
.card{background:#fff;border-radius:12px;padding:16px;max-width:600px;margin:auto;box-shadow:0 2px 10px rgba(0,0,0,.1)}
h2{text-align:center;color:#0A2342;margin-bottom:12px}
label{display:block;margin:10px 0 4px;font-weight:bold;font-size:13px;color:#333}
input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:14px}
textarea{height:80px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:12px;font-size:14px}
.btn-save{background:#0A2342;color:#FFD700}
.btn-sync{background:#16a34a;color:#fff}
.btn-load{background:#1976D2;color:#fff}
.small{font-size:11px;color:#666;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h2>⚙ بيانات الدائرة <span id="dNum"></span></h2>

<label>رقم الدائرة</label>
<input id="num" type="text" placeholder="مثال: 32">

<label>موعد الانعقاد</label>
<input id="maw3ed" type="text" placeholder="مثال: الأحد والثلاثاء">

<div class="row">
<div><label>رئيس الدائرة</label><input id="raees" type="text"></div>
<div><label>عضو يمين</label><input id="yameen" type="text"></div>
</div>
<div class="row">
<div><label>عضو شمال</label><input id="shamal" type="text"></div>
<div><label>أمين السر</label><input id="ameen" type="text"></div>
</div>

<label>ملاحظات / أسماء أخرى</label>
<textarea id="notes"></textarea>

<button class="btn btn-save" onclick="saveLocal()">💾 حفظ على الجهاز ده</button>
<button class="btn btn-sync" onclick="saveAndUpload()">☁ حفظ ورفع للدرايف (عشان يظهر على الموبايل)</button>
<button class="btn btn-load" onclick="loadFromDrive()">🔄 تحميل من الدرايف</button>

<div class="small" id="status">جاري تحميل...</div>
<div class="small">السبب اللي كان مخلي الموبايل فاضي: الصفحة القديمة كانت بتحفظ في localStorage بتاع اللاب فقط، ومبتترفعش للدرايف. النسخة دي بترفعها للدرايف عشان تظهر في كل الأجهزة.</div>
</div>

<script>
const CURRENT_DAIRA = localStorage.getItem('current_daira') || '32';
document.getElementById('dNum').textContent = CURRENT_DAIRA;
const CLOUD_URL='https://script.google.com/macros/s/AKfycbwOTKlstkN7iqYr9IX_CM43EKs6ViBDpMcNJH7s3tU-52LCRIQAFjbI7sx_AD240A/exec?action=get&daira='+CURRENT_DAIRA;
const CLOUD_POST_URL='https://script.google.com/macros/s/AKfycbwOTKlstkN7iqYr9IX_CM43EKs6ViBDpMcNJH7s3tU-52LCRIQAFjbI7sx_AD240A/exec?daira='+CURRENT_DAIRA;
const LS_KEY = 'D'+CURRENT_DAIRA+'_DAIRA_INFO';
const IDB_KEY = 'D'+CURRENT_DAIRA+'_DAIRA_INFO';

function openDB(){
  return new Promise((res,rej)=>{
    let r=indexedDB.open('D'+CURRENT_DAIRA+'_DB',2);
    r.onupgradeneeded=e=>{
      let db=e.target.result;
      try{
        if(!db.objectStoreNames.contains('cases'))db.createObjectStore('cases');
        if(!db.objectStoreNames.contains('ahkam'))db.createObjectStore('ahkam');
        if(!db.objectStoreNames.contains('d32store'))db.createObjectStore('d32store');
      }catch(err){}
    };
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
}
async function idbSet(k,v){
  let db=await openDB();
  return new Promise((rs,rj)=>{
    let tx=db.transaction('d32store','readwrite');
    tx.objectStore('d32store').put(v,k);
    tx.oncomplete=()=>rs();
    tx.onerror=e=>rj(e);
  });
}
async function idbGet(k){
  let db=await openDB();
  return new Promise((rs,rj)=>{
    let tx=db.transaction('d32store','readonly');
    let rq=tx.objectStore('d32store').get(k);
    rq.onsuccess=()=>rs(rq.result);
    rq.onerror=e=>rj(e);
  });
}

function getFormData(){
  return {
    num: document.getElementById('num').value.trim(),
    maw3ed: document.getElementById('maw3ed').value.trim(),
    raees: document.getElementById('raees').value.trim(),
    yameen: document.getElementById('yameen').value.trim(),
    shamal: document.getElementById('shamal').value.trim(),
    ameen: document.getElementById('ameen').value.trim(),
    notes: document.getElementById('notes').value.trim(),
    _updatedAt: Date.now(),
    daira: CURRENT_DAIRA
  };
}
function setFormData(d){
  if(!d) return;
  document.getElementById('num').value = d.num||d.dairaNum||'';
  document.getElementById('maw3ed').value = d.maw3ed||d.mawed||d.date||'';
  document.getElementById('raees').value = d.raees||d.president||'';
  document.getElementById('yameen').value = d.yameen||'';
  document.getElementById('shamal').value = d.shamal||'';
  document.getElementById('ameen').value = d.ameen||'';
  document.getElementById('notes').value = d.notes||'';
}

async function saveLocal(){
  let data = getFormData();
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  try{ await idbSet(IDB_KEY, JSON.stringify(data)); }catch(e){}
  // للتوافق مع النسخ القديمة
  localStorage.setItem('DAIRA_INFO_'+CURRENT_DAIRA, JSON.stringify(data));
  localStorage.setItem('daira_info', JSON.stringify(data));
  document.getElementById('status').textContent='✅ اتحفظ على الجهاز ده - '+new Date().toLocaleString();
  try{ parent.postMessage({type:'D32_DAIRA_INFO_UPDATED',data:data},'*'); }catch(e){}
}

async function loadLocal(){
  let raw = localStorage.getItem(LS_KEY) || localStorage.getItem('DAIRA_INFO_'+CURRENT_DAIRA) || localStorage.getItem('daira_info');
  if(raw){
    try{ setFormData(JSON.parse(raw)); document.getElementById('status').textContent='✅ محمل من الجهاز ده'; return true; }catch(e){}
  }
  try{
    let idbRaw = await idbGet(IDB_KEY);
    if(idbRaw){ setFormData(JSON.parse(idbRaw)); document.getElementById('status').textContent='✅ محمل من IndexedDB'; return true; }
  }catch(e){}
  document.getElementById('status').textContent='⚠ فاضي - اكتب البيانات ودوس حفظ ورفع للدرايف';
  return false;
}

async function loadFromDrive(){
  document.getElementById('status').textContent='⏳ بجيب من الدرايف...';
  try{
    let res = await fetch(CLOUD_URL,{cache:'no-store'});
    let txt = await res.text();
    let j = JSON.parse(txt);
    let info = j.dairaInfo || j.dairaConfig || j.daira_config || j.config || j._dairaInfo || null;
    if(!info && j._dairaInfo) info=j._dairaInfo;
    // بعض النسخ بتحفظها جوه v3 كأول عنصر؟ لا - هنحاول نقراها من حقل منفصل
    if(info){
      setFormData(info);
      await saveLocal();
      document.getElementById('status').textContent='✅ اتحمل من الدرايف - '+new Date(info._updatedAt||Date.now()).toLocaleString();
    } else {
      // لو السكريبت القديم مش بيرجع dairaInfo، جرب نقراها من ملف منفصل لو موجود
      document.getElementById('status').textContent='⚠ الدرايف مفيهوش بيانات دائرة لسه - احفظ من اللاب الأول بدوسة حفظ ورفع للدرايف';
    }
  }catch(e){
    document.getElementById('status').textContent='❌ فشل التحميل من الدرايف: '+e.message;
  }
}

async function saveAndUpload(){
  let data = getFormData();
  await saveLocal();
  document.getElementById('status').textContent='⏳ برفع للدرايف...';
  try{
    // نجيب البيانات الحالية من الدرايف عشان منحذفش القضايا
    let curRes = await fetch(CLOUD_URL,{cache:'no-store'});
    let curTxt = await curRes.text();
    let cur = {};
    try{ cur = JSON.parse(curTxt); }catch(e){ cur={v3:[],ahkam:[]}; }
    if(Array.isArray(cur)) cur={v3:cur,ahkam:[]};
    let v3 = cur.v3||[];
    let ahkam = cur.ahkam||[];
    let payload = {v3:v3, ahkam:ahkam, dairaInfo:data, dairaConfig:data, _password:cur._password||cur.password||localStorage.getItem('current_daira_pass')||'', _masterPassword:cur._masterPassword||localStorage.getItem('admin_master_password')||'Admin@2026', _updatedAt:Date.now()};
    // حماية الأحكام
    if(ahkam.length===0 && cur.ahkam && cur.ahkam.length>0) payload.ahkam=cur.ahkam;
    await fetch(CLOUD_POST_URL,{method:'POST', body:JSON.stringify(payload)});
    document.getElementById('status').textContent='✅ اترفع للدرايف - دلوقتي افتح الموبايل ودوس تحميل من الدرايف';
  }catch(e){
    document.getElementById('status').textContent='❌ فشل الرفع: '+e.message+' - بس اتحفظ محلي';
  }
}

(async()=>{ await loadLocal(); 
  // حاول تحمل من الدرايف تلقائي لو المحلي فاضي
  let hasLocal = localStorage.getItem(LS_KEY);
  if(!hasLocal) setTimeout(loadFromDrive,1500);
})();
</script>
</body>
</html>
