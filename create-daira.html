<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنشاء دائرة جديدة</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;font-family:Tahoma}
body{background:#0A2342;color:#fff;text-align:center;padding:20px;margin:0}
.card{background:#fff;color:#111;max-width:440px;margin:18px auto;padding:22px;border-radius:16px;text-align:right}
h2{margin:6px 0}.sub{color:#ddd;font-size:13px;margin-bottom:8px}
label{font-weight:bold;display:block;margin:12px 0 4px;font-size:13px}
input,select{width:100%;padding:12px;border:2px solid #ccc;border-radius:10px;font-size:14px;font-weight:bold}
.fatra{display:flex;gap:10px}.fatra button{flex:1;padding:12px;border:2px solid #ccc;border-radius:10px;background:#fff;cursor:pointer;font-weight:bold}
.fatra button.active{background:#E8B93C;border-color:#C9A227}
.btn-create{width:100%;padding:14px;background:#0A2342;color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:16px;cursor:pointer}
.btn-install{width:100%;padding:12px;background:#E8B93C;color:#0A2342;border:none;border-radius:10px;font-weight:bold;font-size:15px;margin-top:10px;cursor:pointer}
.msg{color:#b00020;text-align:center;font-weight:bold;margin-top:10px;min-height:20px}
.small{font-size:12px;color:#666;text-align:center;margin-top:10px}
a{color:#0A2342;font-weight:bold}
</style>
</head>
<body>
<div style="font-size:40px">⚖️</div>
<h2>إنشاء دائرة جديدة</h2>
<p class="sub">أنشئ دائرتك في دقيقة وابدأ إدارة قضاياك</p>
<div class="card">
<label>رقم الدائرة (1 - 39)</label>
<input id="dairaNum" type="number" min="1" max="39" placeholder="مثال: 32">
<label>دور الانعقاد</label>
<select id="dawr"><option>الأسبوع الأول</option><option selected>الأسبوع الثاني</option><option>الأسبوع الثالث</option><option>الأسبوع الرابع</option></select>
<label>فترة الانعقاد</label>
<div class="fatra">
<button type="button" id="fatraSabahy" class="active" onclick="setFatra('صباحي')">☀️ صباحي</button>
<button type="button" id="fatraMasaey" onclick="setFatra('مسائي')">🌙 مسائي</button>
</div>
<label>إنشاء باسورد</label>
<input id="pass1" type="password" placeholder="أنشئ باسورد قوي">
<label>تأكيد باسورد</label>
<input id="pass2" type="password" placeholder="أعد كتابة الباسورد">
<button class="btn-create" onclick="createDaira()">إنشاء الدائرة ➜</button>
<button class="btn-install" id="installBtn">📥 تثبيت التطبيق</button>
<p class="msg" id="msg"></p>
<p class="small">عندك دائرة؟ <a href="app.html">سجل دخول</a> • الدائرة موجودة؟ <a href="#" onclick="contactAdmin()">تواصل مع جهة الإدارة</a></p>
</div>
<script>

// حفظ رقم الدائرة في 3 أماكن - عشان ميتضيعش لما تقفل بالـ X
function saveDairaPersist(num, pass){
  try{ localStorage.setItem('current_daira', String(num)); }catch(e){}
  try{ localStorage.setItem('DAIRA', String(num)); }catch(e){}
  try{ if(pass){ localStorage.setItem('daira_pass_'+num, pass); localStorage.setItem('current_daira_pass', pass); } }catch(e){}
  try{ document.cookie='current_daira='+String(num)+';max-age=31536000;path=/'; }catch(e){}
  try{
    var req=indexedDB.open('DAIRA_PERSIST',1);
    req.onupgradeneeded=function(e){ var db=e.target.result; if(!db.objectStoreNames.contains('s')) db.createObjectStore('s'); };
    req.onsuccess=function(e){ var db=e.target.result; var tx=db.transaction('s','readwrite'); tx.objectStore('s').put(String(num),'current_daira'); if(pass) tx.objectStore('s').put(pass,'daira_pass_'+num); };
  }catch(e){}
}
function getDairaFromCookie(){
  try{ var m=document.cookie.match(/(?:^|; )current_daira=([^;]*)/); return m?decodeURIComponent(m[1]):null; }catch(e){ return null; }
}
async function restoreDairaFromAnywhere(){
  // 1. localStorage
  var d = null;
  try{ d = localStorage.getItem('current_daira') || localStorage.getItem('DAIRA'); }catch(e){}
  if(d) return d;
  // 2. cookie
  d = getDairaFromCookie();
  if(d){ try{ localStorage.setItem('current_daira', d); }catch(e){} return d; }
  // 3. IndexedDB
  try{
    d = await new Promise(function(res){
      try{
        var req=indexedDB.open('DAIRA_PERSIST',1);
        req.onupgradeneeded=function(e){ var db=e.target.result; if(!db.objectStoreNames.contains('s')) db.createObjectStore('s'); };
        req.onsuccess=function(e){ var db=e.target.result; var tx=db.transaction('s','readonly'); var q=tx.objectStore('s').get('current_daira'); q.onsuccess=function(){ res(q.result||null); }; q.onerror=function(){ res(null); }; };
        req.onerror=function(){ res(null); };
      }catch(e){ res(null); }
    });
    if(d){ try{ localStorage.setItem('current_daira', d); }catch(e){} return d; }
  }catch(e){}
  // 4. من الباسورد المحفوظ
  try{ for(var i=1;i<=39;i++){ if(localStorage.getItem('daira_pass_'+i)){ localStorage.setItem('current_daira', String(i)); return String(i); } } }catch(e){}
  return null;
}

let fatra='صباحي';
function setFatra(v){fatra=v;document.getElementById('fatraSabahy').classList.toggle('active',v==='صباحي');document.getElementById('fatraMasaey').classList.toggle('active',v==='مسائي');}
function contactAdmin(){location.href='forgot.html';}
const CLOUD='https://script.google.com/macros/s/AKfycbwOTKlstkN7iqYr9IX_CM43EKs6ViBDpMcNJH7s3tU-52LCRIQAFjbI7sx_AD240A/exec';
async function createDaira(){
  const msg=document.getElementById('msg'); msg.textContent='';
  const num=document.getElementById('dairaNum').value.trim();
  const dawr=document.getElementById('dawr').value;
  const p1=document.getElementById('pass1').value; const p2=document.getElementById('pass2').value;
  if(!num||Number(num)<1||Number(num)>39){msg.textContent='اكتب رقم دائرة من 1 لـ 39';return;}
  if(!p1||p1.length<4){msg.textContent='الباسورد لازم 4 حروف على الأقل';return;}
  if(p1!==p2){msg.textContent='الباسورد وتأكيده مش متطابقين';return;}
  if(!navigator.onLine){msg.textContent='وصل النت لاكتمال التثبيت';return;}
  msg.style.color='#0A2342'; msg.textContent='⏳ جاري إنشاء الدائرة وملف الدرايف...';
  try{
    let check=await fetch(CLOUD+'?action=get&daira='+num,{cache:'no-store'}).then(r=>r.text());
    let cj={}; try{cj=JSON.parse(check);}catch(e){}
    let exists = cj && (cj.exists===true || (cj.v3&&cj.v3.length>0) || cj.dairaInfo);
    if(exists){
      msg.style.color='#b00020'; msg.textContent='الدائرة موجودة أصلاً - اختر دائرة أخرى أو تواصل مع جهة الإدارة';
      return;
    }
    let dairaInfo={dairaNumber:String(num),dawr:dawr,fatra:fatra,entag:'مدني مستأنف',_updatedAt:Date.now()};
    let payload={v3:[],ahkam:[],dairaInfo:dairaInfo,dairaConfig:dairaInfo,_password:p1,_updatedAt:Date.now()};
    await fetch(CLOUD+'?daira='+num,{method:'POST',body:JSON.stringify(payload)});
    saveDairaPersist(num, p1);
    try{localStorage.setItem('daira_info_'+num,JSON.stringify(dairaInfo));}catch(e){}
    // سجل الأدمن - هيتحدث من التطبيق عند أول مزامنة
    msg.style.color='#16a34a'; msg.textContent='✅ تم إنشاء الدائرة - جاري الدخول...';
    setTimeout(()=>{location.href='app.html';},800);
  }catch(e){msg.style.color='#b00020'; msg.textContent='فشل الإنشاء: '+e.message+' - تأكد من النت';}
}
let deferredPrompt=null;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;}};
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
