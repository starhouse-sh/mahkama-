<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="daira-core.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<script>
(function(){
  const DB_NAME='D32_DB';
  window.openDB=function(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,2);r.onupgradeneeded=e=>{let db=e.target.result;if(!db.objectStoreNames.contains('cases'))db.createObjectStore('cases');if(!db.objectStoreNames.contains('ahkam'))db.createObjectStore('ahkam');if(!db.objectStoreNames.contains('d32store'))db.createObjectStore('d32store');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
})();
</script>
<title>المحجوزة - أحكام فقط - عدد لكل عضو</title>
<style>
*{font-family:Arial;box-sizing:border-box}
body{background:#f0f0f0;padding:10px}
.card{background:#fff;padding:15px;border-radius:10px;margin-top:10px}
input{padding:8px;border:2px solid #999;border-radius:6px;width:80px;text-align:center;font-weight:bold}
button{padding:8px 15px;background:#0f1f3a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:10px;table-layout:fixed}
th,td{border:2px solid #000;padding:6px;text-align:center;vertical-align:top;font-size:12px}
th{background:#0f1f3a;color:#ffd966}
.raqm-item{background:#f8fafc;border:1px solid #999;border-radius:6px;padding:4px;margin:3px 0;font-weight:bold;font-size:11px;line-height:1.3}
.count-badge{background:#C9A227;color:#000;padding:2px 6px;border-radius:10px;font-size:11px}
.member-head{background:#0f1f3a;color:#ffd966;padding:6px;border-radius:6px;margin-bottom:4px}
.member-stats{background:#fffbe6;border:1px solid #C9A227;border-radius:6px;padding:4px;margin-bottom:6px;font-size:11px;line-height:1.6}
</style>
</head>
<body>
<h3>المحجوزة للحكم - أحكام فقط - عدد الاستئنافات لكل عضو (بالضم)</h3>
<div class="card">
<div>شهر: <input id="m"> سنة: <input id="y"> <button onclick="doSearch()">بحث</button> <button onclick="showAllMonths()">اعرض كل الشهور</button></div>
<div id="info" style="margin-top:10px;background:#fffae6;padding:8px;border-radius:6px"></div>
</div>
<div id="res" class="card">جاري التحميل من D32_DB...</div>

<script>
var DATA=[], DATA_MOT=[];
function cleanDate(s){
  if(!s) return '';
  s=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/-/g,'/').trim();
  var m=s.match(/\d+/g); if(!m||m.length<3) return '';
  var d,mo,ye;
  if(m[0].length==4){ye=m[0];mo=m[1];d=m[2];} else {d=m[0];mo=m[1];ye=m[2]; if(ye.length==2) ye='20'+ye;}
  return ye+'/'+String(mo).padStart(2,'0')+'/'+String(d).padStart(2,'0');
}
function getTar(x){return x.tarHokm||x.tarikhHokm||x.tar||x.tarikh||x.galsaQadima||'';}
function getCode(x){return (x.code||'').toString().trim().toUpperCase()||'A';}
function toAr(n){return String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
function getDammListForAhkam(x){
  if(x.dammList && Array.isArray(x.dammList) && x.dammList.length>0) return x.dammList;
  var r = String(x.raqm||'').trim(), s = String(x.sana||'').trim();
  for(var i=0;i<DATA_MOT.length;i++){
    var m = DATA_MOT[i];
    if(String(m.raqm).trim()==r && String(m.sana).trim()==s){
      if(m.dammList && m.dammList.length>0) return m.dammList;
    }
  }
  if(x.id){
    for(var j=0;j<DATA_MOT.length;j++){
      if(DATA_MOT[j].id==x.id && DATA_MOT[j].dammList && DATA_MOT[j].dammList.length>0) return DATA_MOT[j].dammList;
    }
  }
  if(x.raqmDisplay && x.raqmDisplay.indexOf('\n')>-1){
    var parts=x.raqmDisplay.split('\n').map(s=>s.trim()).filter(s=>s);
    if(parts.length>1){
      return parts.slice(1).map(p=>{
        var mm=p.match(/\d+/g);
        if(mm&&mm.length>=2) return {raqm:mm[0], sana:mm[1]};
        return null;
      }).filter(Boolean);
    }
  }
  return [];
}
function getRaqmDisplayHtml(x){
  var base = (x.raqm||'')+' / '+(x.sana||'');
  var damm = getDammListForAhkam(x);
  if(!damm ||!damm.length) return toAr(base);
  var html = '<div style="font-weight:bold">'+toAr(base)+'</div>';
  damm.forEach(function(d){
    var txt = '';
    if(typeof d==='string') txt = d;
    else txt = (d.raqm||'')+' / '+(d.sana||'');
    html += '<div style="border-top:1px dashed #999;margin-top:2px;padding-top:2px;color:#8B0000;font-size:10px">'+toAr(txt)+'</div>';
  });
  return html;
}

async function loadAll(){
  try{
    let db=await openDB();
    let tx=db.transaction(['cases','ahkam','d32store'],'readonly');
    let r1=tx.objectStore('ahkam').get('D32_AHKAM');
    let r2=tx.objectStore('cases').get('D32_V3');
    let loaded1=false, loaded2=false;
    function tryAutoSearch(){ if(loaded1 && loaded2){ doSearch(); } }
    r1.onsuccess=()=>{
      if(r1.result){
        try{
          let a=JSON.parse(r1.result);
          if(Array.isArray(a)&&Array.isArray(a[1])) a=a[1];
          DATA=a;
          document.getElementById('info').innerHTML='D32_DB: أحكام '+DATA.length;
        }catch(e){}
      }
      loaded1=true; tryAutoSearch();
    };
    r2.onsuccess=()=>{
      if(r2.result){
        try{
          let a=JSON.parse(r2.result);
          if(Array.isArray(a)&&Array.isArray(a[1])) a=a[1];
          DATA_MOT=a;
          document.getElementById('info').innerHTML+=' | متداول '+DATA_MOT.length+' (للضم)';
        }catch(e){}
      }
      loaded2=true; tryAutoSearch();
    };
    r1.onerror=()=>{loaded1=true; tryAutoSearch();}
    r2.onerror=()=>{loaded2=true; tryAutoSearch();}
  }catch(e){ document.getElementById('res').innerHTML='خطأ: '+e.message; }
}

function showAllMonths(){
  var all=DATA;
  if(all.length==0){ document.getElementById('res').innerHTML='لا يوجد بيانات'; return; }
  var months={};
  all.forEach(function(x){
    var tar=getTar(x); if(!tar) return;
    var c=cleanDate(tar); if(!c) return;
    var p=c.split('/'); var key=p[0]+'/'+p[1];
    if(!months[key]) months[key]=0; months[key]++;
  });
  var html='<h4>الشهور الموجودة:</h4><table><tr><th>شهر / سنة</th><th>العدد</th><th>بحث</th></tr>';
  Object.keys(months).sort().forEach(function(k){
    var parts=k.split('/');
    html+='<tr><td>'+parts[1]+' / '+parts[0]+'</td><td>'+months[k]+'</td><td><button onclick="document.getElementById(\'m\').value='+parts[1]+';document.getElementById(\'y\').value='+parts[0]+';doSearch()">بحث</button></td></tr>';
  });
  html+='</table>';
  document.getElementById('res').innerHTML=html;
}

function doSearch(){
  var mVal=parseInt(document.getElementById('m').value);
  var yVal=parseInt(document.getElementById('y').value);
  if(!mVal||!yVal){ document.getElementById('res').innerHTML='ادخل شهر وسنة'; return; }
  var all=DATA;
  var filtered=[];
  all.forEach(function(x){
    var tar=getTar(x); if(!tar) return;
    var c=cleanDate(tar); if(!c) return;
    var p=c.split('/'); var yy=parseInt(p[0]), mm=parseInt(p[1]);
    if(mm==mVal && yy==yVal) filtered.push(x);
  });
  if(filtered.length==0){
    document.getElementById('res').innerHTML='<div style="color:red;text-align:center;padding:20px">❌ لا يوجد في D32_AHKAM لشهر '+mVal+'/'+yVal+'<br>إجمالي: '+DATA.length+'<br><button onclick="showAllMonths()">اعرض الشهور</button></div>';
    return;
  }
  var seen={}; var uniq=[];
  filtered.forEach(function(x){
    var k=(x.raqm||'')+'/'+(x.sana||'');
    if(!k||k=='/') return;
    if(!seen[k]){seen[k]=true; uniq.push(x);}
  });
  var codes={};
  uniq.forEach(function(x){
    var c=getCode(x);
    if(!codes[c]) codes[c]=[];
    codes[c].push(x);
  });
  var displayCodes=Object.keys(codes).sort();
  var defaults=['A','B','C','D','E','F','G'];
  defaults.forEach(function(d){ if(displayCodes.indexOf(d)==-1) displayCodes.push(d); });
  displayCodes=displayCodes.filter((v,i,a)=>a.indexOf(v)===i).sort().slice(0,7);
  while(displayCodes.length<7){
    for(var i=0;i<defaults.length;i++){ if(displayCodes.indexOf(defaults[i])==-1){ displayCodes.push(defaults[i]); break; } }
    if(displayCodes.length>=7) break;
  }
  displayCodes.sort();

  var html='<table><thead><tr>';
  displayCodes.forEach(function(c){
    var arr=codes[c]||[];
    var fileCount=arr.length;
    var dammTotal=0;
    arr.forEach(function(x){ dammTotal+=getDammListForAhkam(x).length; });
    var appealCount=fileCount + dammTotal; // المنضم محسوب
    html+='<th style="vertical-align:top;padding:4px"><div class="member-head">عضو '+c+'</div><div class="member-stats"><div>ملفات: <span class="count-badge">'+toAr(fileCount)+'</span></div><div>استئنافات: <span class="count-badge" style="background:#0f1f3a;color:#ffd966">'+toAr(appealCount)+'</span></div></div></th>';
  });
  html+='</tr></thead><tbody><tr>';
  displayCodes.forEach(function(c){
    var arr=codes[c]||[];
    html+='<td>';
    arr.forEach(function(x){
      html+='<div class="raqm-item">'+getRaqmDisplayHtml(x)+'</div>';
    });
    if(arr.length==0) html+='<div style="color:#999">—</div>';
    html+='</td>';
  });
  html+='</tr></tbody></table>';
  document.getElementById('res').innerHTML=html;
}

window.onload=function(){
  var now=new Date();
  var curM=now.getMonth()+1;
  var curY=now.getFullYear();
  var defM=curM+1;
  var defY=curY;
  if(defM>12){defM=1; defY=curY+1;}
  document.getElementById('m').value=defM;
  document.getElementById('y').value=defY;
  loadAll();
};
</script>
</body>
</html>
