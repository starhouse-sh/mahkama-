<style>

}

<script>
// ===== يعمل حتى لو مفيش قاعدة - بناء الورقة فورا =====
const DB_NAME='D32_DB';
let DATA=[], DATA_MOT=[], MEMBERS={}, ALL_LIST=[];
let CURRENT_CASE={}, CURRENT_DAMM=[];

var DAIRA_NUM='32';
async function loadDairaNum(){
  try{
    var db=await openDB();
    var keys=['D32_DAIRA_CONFIG','D32_CIRCLE','D32_CONFIG','D32_DAIRA'];
    for(var i=0;i<keys.length;i++){
      var val=await new Promise(function(res){
        var tx=db.transaction('d32store','readonly');
        var rq=tx.objectStore('d32store').get(keys[i]);
        rq.onsuccess=function(){res(rq.result);}; rq.onerror=function(){res(null);};
      });
      if(val){
        try{
          var c=(typeof val==='string')?JSON.parse(val):val;
          var n=c.dairaNumber||c.daira||c.circle||c.number||'';
          if(n){ DAIRA_NUM=String(n); window.CURRENT_DAIRA=DAIRA_NUM; window.DAIRA_NUMBER=DAIRA_NUM; break; }
        }catch(e){}
      }
    }
  }catch(e){}
  try{ buildPaper(); }catch(e){}
  return DAIRA_NUM;
}

function openDB(){
  return new Promise((res,rej)=>{
    try{
      let r=indexedDB.open(DB_NAME,2);
      r.onupgradeneeded=e=>{
        let db=e.target.result;
        try{ if(!db.objectStoreNames.contains('cases')) db.createObjectStore('cases'); }catch(e){}
        try{ if(!db.objectStoreNames.contains('ahkam')) db.createObjectStore('ahkam'); }catch(e){}
        try{ if(!db.objectStoreNames.contains('d32store')) db.createObjectStore('d32store'); }catch(e){}
      };
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
      r.onblocked=()=>{ try{res(r.result);}catch(e){res(null);} };
    }catch(e){ rej(e); }
  });
}
function toAr(n){if(n==null||n==='')return'';return String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
function toEn(s){return String(s||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));}
function isIltimasCase(x){
  if(!x) return false;
  try{
    let txt = JSON.stringify(x||{});
    if(txt.includes('التماس') || txt.includes('إلتماس') || txt.includes('التماس')) return true;
    let fields = [x.no3||'', x.type||'', x.no3ElDa3wa||'', x.mawdou3||'', x.mawdoo3||'', x.mawdou3Text||'', x.title||'', x.qar||'', x.mantouq||''].join(' ');
    if(fields.includes('التماس') || fields.includes('إلتماس')) return true;
  }catch(e){}
  return false;
}
function getTarikhHokm(x){if(!x) return ''; return x.tarikhHokm||x.tarHokm||x.tar||x.galsa||'';}
function getDayName(d){try{if(!d) return ''; let c=d.replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)); let p=c.split(/[\/\-]/).map(s=>s.trim()); let y,m,day; if(p[0].length===4){y=parseInt(p[0]); m=parseInt(p[1])-1; day=parseInt(p[2]);} else {day=parseInt(p[0]); m=parseInt(p[1])-1; y=parseInt(p[2]); if(y<100) y+=2000;} let dt=new Date(y,m,day); if(isNaN(dt.getTime())) return ''; let days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']; return days[dt.getDay()];}catch(e){return '';}}
function resolveMember(c){if(!c) return ''; let s=String(c).trim(); if(s.length===1 && /^[A-G]$/.test(s)) return MEMBERS[s]||''; return s;}
function getDammList(x){
  if(!x) return [];
  if(x.dammList && Array.isArray(x.dammList) && x.dammList.length>0) return x.dammList;
  try{
    let r = String(x.raqm||'').trim();
    if(r && DATA_MOT){
      for(let i=0;i<DATA_MOT.length;i++){
        let m=DATA_MOT[i];
        if(String(m.raqm).trim()===r && String(m.sana).trim()===String(x.sana||'').trim()){
          if(m.dammList && m.dammList.length>0) return m.dammList;
        }
      }
    }
  }catch(e){}
  return [];
}
function getRaqm(x){return (x&&x.raqm||'').toString().trim();}
function getSana(x){return (x&&x.sana||'').toString().trim();}
function getMost(x){return (x&& (x.mostanef||x.most)||'').toString().trim();}
function getDed(x){return (x&& (x.ded)||'').toString().trim();}
function getHay2a(x){ if(!x) return []; if(x.hay2aAwal && Array.isArray(x.hay2aAwal) && x.hay2aAwal.length>0) return x.hay2aAwal; if(x.hay2a && Array.isArray(x.hay2a) && x.hay2a.length>0) return x.hay2a; if(x.hay2aAwalText) return String(x.hay2aAwalText).split(/[-–—]/).map(s=>s.trim()).filter(Boolean); return []; }
function cleanManteqPrefix(s){
  if(!s) return '';
  var orig = s.trim();
  var pattern = /^\s*حكمت\s+المحكمة\s*/;
  var cleaned = orig.replace(pattern, '');
  return cleaned;
}
function getManteqFromDB(x){
  if(!x) return '';
  var raw = (x.manteq||x.mantouq||x.mantouqText||x.qar||x.qarar||x.qararHokm||x.mantouqHokm||x.hokmManteq||x.mantoq||x.nasManteq||x.manteqHokm||x.qarText||'').toString().trim();
  return cleanManteqPrefix(raw);
}
function getHaytheyatFromDB(x){
  if(!x) return '';
  return (x.haytheyat||x.haythiyat||x.haytheyatText||x.asbab||x.asbabHokm||x.haytheyatHokm||x.haythiat||x.ta3lil||x.taalil||'').toString().trim();
}
function getDairaNumberForMantoq(){
  try{
    if(DAIRA_NUM && DAIRA_NUM!=='32') return DAIRA_NUM;
    if(window.CURRENT_DAIRA) return window.CURRENT_DAIRA;
    if(window.DAIRA_NUMBER) return window.DAIRA_NUMBER;
    var cur = window.CURRENT_CASE || window.CURRENT_CASE_SERIAL_DATA || {};
    if(cur.dayra) return cur.dayra;
    if(cur.daira) return cur.daira;
    if(cur.dairaNumber) return cur.dairaNumber;
    if(cur.DAIRA_NUMBER) return cur.DAIRA_NUMBER;
    if(typeof getJoz2iData === 'function'){
      var jz = getJoz2iData(cur);
      if(jz && (jz.dayra||jz.daira)) return jz.dayra||jz.daira;
    }
    return '';
  }catch(e){ return ''; }
}


function getJoinedCasesDetails(){
  let list = CURRENT_DAMM||[];
  if(!list || list.length===0) return [];
  let all = (ALL_LIST||[]).concat(DATA||[]).concat(DATA_MOT||[]);
  let found=[];
  list.forEach(d=>{
    let r = String(d.raqm||d.r||'').trim();
    let s = String(d.sana||d.s||'').trim();
    if(!r) return;
    let f = all.find(x=> String(x.raqm).trim()===r && (!s || String(x.sana).trim()===s));
    if(f) found.push(f);
    else found.push({raqm:r, sana:s, mostanef: d.mostanef||'', ded: d.ded||'', isMissing:true});
  });
  return found;
}
function findCaseByRaqmSana(raqm, sana){
  try{
    let all = (ALL_LIST||[]).concat(DATA||[]).concat(DATA_MOT||[]);
    let re = toEn(String(raqm||'').trim());
    let se = toEn(String(sana||'').trim());
    for(let x of all){ if(toEn(getRaqm(x))===re && toEn(getSana(x))===se) return x; }
    for(let x of all){ if(toEn(getRaqm(x))===re) return x; }
  }catch(e){}
  return null;
}
function fillSelect(list){
  try{
    let sel=document.getElementById('caseSelect');
    if(!sel) return;
    sel.innerHTML='<option value="">-- اختر قضية --</option>';
    list.forEach((x,i)=>{
      let raqm=getRaqm(x), sana=getSana(x);
      if(!raqm) return;
      let opt=document.createElement('option');
      opt.value=i;
      opt.textContent=toAr(raqm)+' / '+toAr(sana)+' - '+getMost(x);
      sel.appendChild(opt);
    });
    ALL_LIST=list;
  }catch(e){}
}
function findKashidaInsertPos(word){
 if(word==='وعضوية') return 3;
 const preferred = ['ض','ص','س','ش','ط','ظ','ع','غ','ف','ق','ك','ل','م','ن','ب','ت','ث','ج','ح','خ','ر','ز','ذ','د'];
 for(let i=word.length-2; i>=1; i--){
   if(preferred.includes(word[i])){
     let nxt = word[i+1];
     if(nxt==='ة' || nxt==='ـ') continue;
     let noConnect = ['ا','أ','إ','آ','د','ذ','ر','ز','و','ؤ'];
     if(noConnect.includes(word[i])) continue;
     return i+1;
   }
 }
 return Math.max(1, word.length-1);
}
function kashidaInsideWord(word, count){
 if(!word || word.length<3 || count<=0) return word;
 let pos = findKashidaInsertPos(word);
 return word.slice(0,pos) + 'ـ'.repeat(count) + word.slice(pos);
}
function stretchLineWithKashida(line, targetLen){
 if(!line) return line;
 let words = line.split(' ');
 let diff = targetLen - line.length;
 if(diff<=0) return line;
 let eligibleIdx = [];
 words.forEach((w,i)=>{ if(w.length>=3) eligibleIdx.push(i); });
 if(eligibleIdx.length===0) return line;
 let per = Math.floor(diff / eligibleIdx.length);
 let rem = diff % eligibleIdx.length;
 let newWords = [...words];
 eligibleIdx.forEach((idx, j)=>{
   let extra = per + (j<rem?1:0);
   if(extra>0){ newWords[idx] = kashidaInsideWord(newWords[idx], extra); }
 });
 return newWords.join(' ');
}

function justifyJudgesNames(names){
  let clean = names.map(s=> String(s||'').trim()).filter(s=> s && s!=='.........' );
  if(clean.length===0) return names;
  let maxLen = Math.max(...clean.map(s=> s.length));
  return names.map(n=>{
    let orig = String(n||'').trim();
    if(!orig || orig==='.........') return orig;
    if(orig.length>=maxLen) return orig;
    let words = orig.split(/\s+/);
    let diff = maxLen - orig.length;
    if(words.length===1){
      return stretchLineWithKashida(orig, maxLen);
    } else {
      let perWord = Math.floor(diff / words.length);
      let rem = diff % words.length;
      let stretched = words.map((w,i)=>{
        let extra = perWord + (i < rem ? 1 : 0);
        if(extra<=0) return w;
        return kashidaInsideWord(w, extra);
      });
      let result = stretched.join(' ');
      while(result.length < maxLen){
        stretched[0] = kashidaInsideWord(stretched[0], 1);
        result = stretched.join(' ');
        if(result.length >= maxLen+5) break;
      }
      return result;
    }
  });
}

function justifyLinesWithKashida(lines){
 let maxLen = Math.max(...lines.map(s=>s.length));
 return lines.map(s=> s.length>=maxLen ? s : stretchLineWithKashida(s, maxLen));
}



function buildPaper(){
 try{

function fillFromCase(x){
 if(!x) return;
 CURRENT_CASE=x; CURRENT_DAMM=getDammList(x);
 try{
  document.getElementById('f_raqm').value=getRaqm(x);
  document.getElementById('f_sana').value=getSana(x);
  document.getElementById('f_mostanef').value=getMost(x);
  document.getElementById('f_ded').value=getDed(x);
  document.getElementById('f_tar').value=getTarikhHokm(x);
  let jz=getJoz2iData(x);
  document.getElementById('f_mawdou3_tarikh').value=jz.tar||'';
  document.getElementById('f_raqm_joz2i').value=jz.raqm||'';
  document.getElementById('f_sana_joz2i').value=jz.sana||'';
  document.getElementById('f_mahkama_1').value=jz.mahkama||'';
  try{
    let m = getManteqFromDB(x);
    let h = getHaytheyatFromDB(x);
    let fMan = document.getElementById('f_manteq');
    let fHay = document.getElementById('f_haytheyat');
    if(fMan){ fMan.value = m||''; }
    if(fHay){ fHay.value = h||''; }
  }catch(e){}

  let hayAwal = null;
  if(x.hay2aAwal && Array.isArray(x.hay2aAwal) && x.hay2aAwal.length>0) hayAwal = x.hay2aAwal;
  else if(x.hay2a && Array.isArray(x.hay2a) && x.hay2a.length>0) hayAwal = x.hay2a;
  else if(x.hay2aAwalText && String(x.hay2aAwalText).trim()) hayAwal = String(x.hay2aAwalText).split(/[-–—]/).map(s=>s.trim()).filter(Boolean);
  else hayAwal = getHay2a(x);

  let hayAkher = null;
  if(x.hay2aAkher && Array.isArray(x.hay2aAkher) && x.hay2aAkher.length>0) hayAkher = x.hay2aAkher;
  else if(x.hay2aAkherText && String(x.hay2aAkherText).trim()) hayAkher = String(x.hay2aAkherText).split(/[-–—]/).map(s=>s.trim()).filter(Boolean);
  else hayAkher = x.hay2aAkher||[];

  let hasAwal = hayAwal && hayAwal.length>0;
  let hasAkher = hayAkher && hayAkher.length>0;

  if(hasAwal){
    let r1=hayAwal.map(c=>resolveMember(c));
    document.getElementById('f_rais').value=r1[0]||'';
    document.getElementById('f_member2').value=r1[1]||'';
    document.getElementById('f_member3').value=r1[2]||'';
    try{
      document.getElementById('m_f_rais').value=r1[0]||'';
      document.getElementById('m_f_member2').value=r1[1]||'';
      document.getElementById('m_f_member3').value=r1[2]||'';
    }catch(e){}
  }

  if(hasAkher){
    let r2=hayAkher.map(c=>resolveMember(c));
    document.getElementById('f_rais2').value=r2[0]||'';
    document.getElementById('f_member2_2').value=r2[1]||'';
    document.getElementById('f_member3_2').value=r2[2]||'';
    document.getElementById('f_has_hay2a').checked=true;
    try{
      document.getElementById('m_f_rais2').value=r2[0]||'';
      document.getElementById('m_f_member2_2').value=r2[1]||'';
      document.getElementById('m_f_member3_2').value=r2[2]||'';
      document.getElementById('m_hasHay2a').checked=true;
    }catch(e){}
  }

 }catch(e){ console.log('fillFromCase hay2a error',e); }
 buildPaper();
}

async function fetchWakilAminFromDB(){
  try{
    let db = await openDB();
    if(!db) return;
    let stores = [...db.objectStoreNames];
    if(stores.includes('d32store')){
      try{
        let tx = db.transaction('d32store','readonly');
        let store = tx.objectStore('d32store');
        let keysToTry = ['D32_DAIRA_INFO','D32_DAIRA_CONFIG','D32_CONFIG','DAIRA_32','CIRCUIT_32','D32_WAKIL','D32_AMIN','WAKIL_NIYABA','AMIN_SIR','D32_DAIRA_DATA','D32_SETTINGS'];
        for(let k of keysToTry){
          try{
            let req = store.get(k);
            let data = await new Promise(res=>{ req.onsuccess=()=>res(req.result); req.onerror=()=>res(null); });
            if(data){
              let o = typeof data==='string'?JSON.parse(data):data;
              try{
                let pd = o.dairaNumber || o.DAIRA_NUMBER || o.dairaNo;
                if(pd){
                  let dn = String(pd).replace(/[^0-9٠-٩]/g,'').trim();
                  if(dn){ window.CURRENT_DAIRA = dn; window.DAIRA_NUMBER = dn; }
                }
              }catch(e){}
              if(o.wakil || o.wakilNiyaba || o.WAKIL || o.wakil_niyaba || o.ra2isNiyaba || o.niyaba){
                let w = o.wakil || o.wakilNiyaba || o.WAKIL || o.wakil_niyaba || o.ra2isNiyaba || o.niyaba;
                if(typeof w==='string' && w.trim()){ window.WAKIL_NIYABA = w.trim(); try{ document.getElementById('f_wakil').value=w.trim(); }catch(e){} }
              }
              if(o.amin || o.aminSir || o.AMIN || o.amin_sir || o.aminsir){
                let a = o.amin || o.aminSir || o.AMIN || o.amin_sir || o.aminsir;
                if(typeof a==='string' && a.trim()){ window.AMIN_SIR = a.trim(); try{ document.getElementById('f_amin').value=a.trim(); }catch(e){} }
              }
              if(o.daira && typeof o.daira==='object'){

                if(o.daira.amin) { window.AMIN_SIR = String(o.daira.amin).trim(); try{ document.getElementById('f_amin').value=window.AMIN_SIR; }catch(e){} }
              }
            }
          }catch(e){}
        }
        try{
          let allReq = store.getAll();
          let allData = await new Promise(res=>{ allReq.onsuccess=()=>res(allReq.result); allReq.onerror=()=>res([]); });
          for(let d of allData){
            try{
              let o = typeof d==='string'?JSON.parse(d):d;
              if(!o || typeof o!=='object') continue;
              if(o.wakilNiyaba && !window.WAKIL_NIYABA){ window.WAKIL_NIYABA = String(o.wakilNiyaba).trim(); try{ document.getElementById('f_wakil').value=window.WAKIL_NIYABA; }catch(e){} }
              if(o.wakil && !window.WAKIL_NIYABA && typeof o.wakil==='string'){ window.WAKIL_NIYABA = String(o.wakil).trim(); try{ document.getElementById('f_wakil').value=window.WAKIL_NIYABA; }catch(e){} }
              if(o.aminSir && !window.AMIN_SIR){ window.AMIN_SIR = String(o.aminSir).trim(); try{ document.getElementById('f_amin').value=window.AMIN_SIR; }catch(e){} }
              if(o.amin && !window.AMIN_SIR && typeof o.amin==='string'){ window.AMIN_SIR = String(o.amin).trim(); try{ document.getElementById('f_amin').value=window.AMIN_SIR; }catch(e){} }
            }catch(e){}
          }
        }catch(e){}
      }catch(e){}

    results = results.filter(x=> getCodeAhkam(x)===filterVal);
  }
  let html='<div style="overflow:auto;max-height:60vh;border:1px solid #0f1f3a"><table style="width:290px;border-collapse:collapse;table-layout:fixed"><thead><tr style="background:#0f1f3a;color:#fff;position:sticky;top:0;z-index:2"><th style="padding:3px;border:1px solid #000;width:30px;background:#0f1f3a;color:#fff;font-size:12px">م</th><th style="padding:3px;border:1px solid #000;width:150px;background:#0f1f3a;color:#fff;font-size:12px">رقم/سنة</th><th style="padding:3px;border:1px solid #000;width:110px;background:#0f1f3a;color:#fff;font-size:12px">عضو</th></tr></thead><tbody>';
  for(let i=0;i<results.length;i++){
    let x=results[i];
    let origIdx = window.ALL_DATE_RESULTS ? window.ALL_DATE_RESULTS.findIndex(y=> String(getRaqm(y)).trim()===String(getRaqm(x)).trim() && String(getSana(y)).trim()===String(getSana(x)).trim() && String(getMost(y)).trim()===String(getMost(x)).trim()) : i;
    let serialToShow = origIdx>=0 ? origIdx+1 : i+1;
    let raqmHtml = getRaqumHtmlAhkam(x);
    let code = getCodeAhkam(x); let memberName = getMemberNameFromCode(code); if(!memberName) memberName = code||''; 
    let bg=(i%2===0)?'#fff':'#f1f8e9';
    html+='<tr style="background:'+bg+';cursor:pointer" onclick="selectFromDateListByCase('+i+')" onmouseover="this.style.background=\'#ffec99\'" onmouseout="this.style.background=\''+bg+'\'"><td style="padding:3px;border:1px solid #000;text-align:center;font-weight:bold;background:#FFE4B5;font-size:12px;width:30px">'+toAr(typeof serialToShow!=='undefined'?serialToShow:i+1)+'</td><td style="padding:3px;border:1px solid #000;text-align:center;line-height:1.2;cursor:pointer;font-weight:bold;font-size:12px;width:150px;word-wrap:break-word;white-space:normal" title="اضغط لعرض الحكم">'+raqmHtml+'</td><td style="padding:4px;border:1px solid #000;text-align:center;background:#fffbe6;font-weight:bold;color:#8B0000;font-size:13px;width:110px;white-space:nowrap;overflow:visible">'+toArText(memberName||code||'-')+'</td></tr>';
  }
  html+='</tbody></table></div><div style="margin-top:4px;padding:4px;background:#fffde7;border-radius:4px;font-size:9px;color:#333;text-align:center;border:1px solid #C9A227">إجمالي <b>'+toAr(results.length)+'</b></div>';
  if(listDiv) listDiv.innerHTML=html;
  window.CURRENT_DATE_RESULTS = results;
}

function filterByMemberChanged(){
  let filterVal = (document.getElementById('filterByMember')?.value||'ALL').toUpperCase();
  let source = window.ALL_DATE_RESULTS || window.CURRENT_DATE_RESULTS || [];
  if(!source || !source.length) return;
  let results = source.slice();
  if(filterVal!=='ALL'){
    results = results.filter(x=> getCodeAhkam(x)===filterVal);
  }
  let listDiv=document.getElementById('dateResultsList');
  let badge=document.getElementById('dateResultsBadge');
  if(badge) badge.textContent=toAr(results.length);
  if(results.length===0){
    if(listDiv) listDiv.innerHTML='<div style="padding:10px;color:#b71c1c;text-align:center;font-size:13px">لا يوجد أحكام بالكود '+filterVal+' في هذا التاريخ</div>';
    window.CURRENT_DATE_RESULTS = [];
    return;
  }
  let html='<div style="overflow:auto;max-height:60vh;border:1px solid #0f1f3a"><table style="width:290px;border-collapse:collapse;table-layout:fixed"><thead><tr style="background:#0f1f3a;color:#fff;position:sticky;top:0;z-index:2"><th style="padding:4px;border:1px solid #000;width:30px;background:#0f1f3a;color:#fff;font-size:12px">م</th><th style="padding:4px;border:1px solid #000;width:150px;background:#0f1f3a;color:#fff;font-size:12px">رقم/سنة</th><th style="padding:4px;border:1px solid #000;width:110px;background:#0f1f3a;color:#fff;font-size:12px">عضو</th></tr></thead><tbody>';
  for(let i=0;i<results.length;i++){
    let x=results[i];
    let origIdx = source ? source.findIndex(y=> String(getRaqm(y)).trim()===String(getRaqm(x)).trim() && String(getSana(y)).trim()===String(getSana(x)).trim() && String(getMost(y)).trim()===String(getMost(x)).trim()) : i;
    let serialToShow = origIdx>=0 ? origIdx+1 : i+1;
    let raqmHtml = getRaqumHtmlAhkam(x);
    let code = getCodeAhkam(x); let memberName = getMemberNameFromCode(code); if(!memberName) memberName = code||''; 
    let bg=(i%2===0)?'#fff':'#f1f8e9';
    html+='<tr style="background:'+bg+';cursor:pointer" onclick="selectFromDateListByCaseFiltered('+i+')" onmouseover="this.style.background=\'#ffec99\'" onmouseout="this.style.background=\''+bg+'\'"><td style="padding:4px;border:1px solid #000;text-align:center;font-weight:bold;background:#FFE4B5;font-size:12px;width:30px">'+toAr(serialToShow)+'</td><td style="padding:4px;border:1px solid #000;text-align:center;line-height:1.2;cursor:pointer;font-weight:bold;font-size:12px;width:150px;word-wrap:break-word;white-space:normal" title="اضغط لعرض الحكم">'+raqmHtml+'</td><td style="padding:4px;border:1px solid #000;text-align:center;background:#fffbe6;font-weight:bold;color:#8B0000;font-size:13px;width:110px;white-space:nowrap;overflow:visible">'+toArText(memberName||code||'-')+'</td></tr>';
  }
  html+='</tbody></table></div><div style="margin-top:4px;padding:4px;background:#fffde7;border-radius:4px;font-size:10px;color:#333;text-align:center;border:1px solid #C9A227">إجمالي <b>'+toAr(results.length)+'</b> '+(filterVal!=='ALL'?'بالكود '+filterVal:'')+'</div>';
  if(listDiv) listDiv.innerHTML=html;
  window.CURRENT_DATE_RESULTS = results;
}
function selectFromDateListByCaseFiltered(i){
  if(!window.CURRENT_DATE_RESULTS || !window.CURRENT_DATE_RESULTS[i]) return;
  let x = window.CURRENT_DATE_RESULTS[i];
  let origSerial = getOriginalSerialForCase(x);
  window.CURRENT_SERIAL = origSerial || (i+1);
  window.CURRENT_CASE_SERIAL_DATA = x;
  fillFromCase(x);
}

function getOriginalSerialForCase(x){
  if(!window.ALL_DATE_RESULTS) return null;
  let idx = window.ALL_DATE_RESULTS.findIndex(y=> String(getRaqm(y)).trim()===String(getRaqm(x)).trim() && String(getSana(y)).trim()===String(getSana(x)).trim() && String(getMost(y)).trim()===String(getMost(x)).trim());
  return idx>=0 ? idx+1 : null;
}
function selectFromDateListByCase(i){
  if(!window.CURRENT_DATE_RESULTS || !window.CURRENT_DATE_RESULTS[i]) return;
  let x = window.CURRENT_DATE_RESULTS[i];
  let origSerial = getOriginalSerialForCase(x);
  window.CURRENT_SERIAL = origSerial || (i+1);
  window.CURRENT_CASE_SERIAL_DATA = x;
  fillFromCase(x);
  let msg=document.getElementById('searchMsg');
  if(msg){ msg.textContent='✓ تم تحميل '+toAr(getRaqm(x))+' / '+toAr(getSana(x))+' - '+toArText(getCodeAhkam(x)); msg.style.color='green'; }
}

</script>
