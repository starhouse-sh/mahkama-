<style>
body{font-family:system-ui;background:#0b1e3a;color:#fff;text-align:center;padding:20px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:600px;margin:20px auto}
button{padding:14px;border:none;border-radius:12px;background:#f8d775;font-weight:bold;font-size:16px;cursor:pointer}
#box{display:none;background:#fff;color:#111;padding:20px;border-radius:14px;max-width:400px;margin:20px auto}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;text-align:center}
</style>

<script>
// دالة تحديث الأيقونة والاسم ديناميكي حسب رقم الدائرة
function updateManifestForDaira(daira){
  try{
    const manifest = {
      name: `نظام د${daira}`,
      short_name: `نظام د${daira}`,
      start_url: "./select-daira.html",
      display: "standalone",
      background_color: "#0A2342",
      theme_color: "#0A2342",
      scope: "./",
      icons: [
        {src: "./icon-192.png", sizes: "192x192", type: "image/png"},
        {src: "./icon-512.png", sizes: "512x512", type: "image/png", purpose: "any maskable"}
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    let link = document.querySelector('link[rel=manifest]');
    if(!link){
      link = document.createElement('link');
      link.rel = 'manifest';
      document.head.appendChild(link);
    }
    link.href = url;
    document.title = `نظام د${daira}`;
    // خزن الاسم للـ index
    localStorage.setItem('pending_daira_name', `نظام د${daira}`);
  }catch(e){console.log('manifest dynamic fail', e);}
}
</script>

</head>
<body>
<h2>⚖️ اختار الدائرة</h2>
<p>اختار رقم دايرتك واكتب الباسورد بتاعها</p>
<div class="grid" id="grid"></div>
<div id="box">
<h3 id="title">دائرة</h3>
<input id="pass" type="password" placeholder="باسورد الدائرة">
<br>
<button onclick="enter()">دخول</button>
<p id="msg" style="color:red"></p>
</div>
<script>
const grid=document.getElementById('grid');
for(let i=1;i<=39;i++){
  const b=document.createElement('button');
  b.textContent='د/'+i;
  b.onclick=()=>{updateManifestForDaira(i); document.getElementById('box').style.display='block';document.getElementById('title').textContent='دائرة '+i+' - نظام د'+i;document.getElementById('box').dataset.daira=i;document.getElementById('pass').value='';document.getElementById('msg').textContent='';};
  grid.appendChild(b);
}
function enter(){
  const daira=document.getElementById('box').dataset.daira;
  const pass=document.getElementById('pass').value.trim();
  if(!pass){document.getElementById('msg').textContent='اكتب الباسورد';return;}
  // أول واحد بيحجز الدائرة بباسورده، والتاني لازم يدخل نفس الباسورد
  const key='daira_pass_'+daira;
  const saved=localStorage.getItem(key);
  if(saved && saved!==pass){document.getElementById('msg').textContent='الباسورد غلط للدائرة دي';return;}
  if(!saved) localStorage.setItem(key,pass);
  localStorage.setItem('current_daira',daira);
  localStorage.setItem('current_daira_pass',pass);
  location.href='index.html';
}
</script>
