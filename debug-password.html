<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>تشخيص باسورد الدائرة 32</title>
<style>body{font-family:Tahoma;background:#0A2342;color:#fff;padding:20px;text-align:center}
.card{background:#fff;color:#111;max-width:500px;margin:20px auto;padding:20px;border-radius:12px;text-align:right}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:2px solid #ccc;font-weight:bold}
button{background:#0A2342;color:#FFD700;cursor:pointer}
pre{background:#f5f5f5;padding:10px;border-radius:8px;direction:ltr;text-align:left;overflow:auto;font-size:12px}
</style>
</head>
<body>
<h2>⚖ تشخيص باسورد دائرة 32</h2>
<p style="color:#cbd5e1">الصفحة دي بتوريك الباسورد اللي فعلا متسجل في الدرايف</p>
<div class="card">
<label>رقم الدائرة</label>
<input id="dairaNum" value="32">
<label>الباسورد اللي بتجربه على الموبايل</label>
<input id="tryPass" type="text" placeholder="اكتب الباسورد اللي بتكتبه على الموبايل">
<button onclick="checkPass()">🔍 افحص الباسورد في الدرايف</button>
<div id="result" style="margin-top:15px"></div>
<pre id="raw" style="display:none"></pre>
<button onclick="fixPass()" id="fixBtn" style="display:none;background:#16a34a">🔧 حدث باسورد الدرايف بالباسورد ده</button>
</div>
<script>
const CLOUD='https://script.google.com/macros/s/AKfycbwOTKlstkN7iqYr9IX_CM43EKs6ViBDpMcNJH7s3tU-52LCRIQAFjbI7sx_AD240A/exec';
async function checkPass(){
  const num=document.getElementById('dairaNum').value.trim()||'32';
  const tryPass=document.getElementById('tryPass').value;
  const resDiv=document.getElementById('result');
  const rawPre=document.getElementById('raw');
  resDiv.innerHTML='⏳ بجيب البيانات من الدرايف...';
  try{
    let r=await fetch(CLOUD+'?action=get&daira='+num,{cache:'no-store'});
    let t=await r.text();
    rawPre.style.display='block';
    rawPre.textContent=t.slice(0,2000);
    let j={}; try{ j=JSON.parse(t);}catch(e){ resDiv.innerHTML='❌ الدرايف رجع مش JSON: '+t.slice(0,200); return; }
    let cloudPass=j._password||j.password||'';
    let localPass=localStorage.getItem('daira_pass_'+num)||localStorage.getItem('current_daira_pass')||'(مفيش لوكال)';
    
    let html='<b>دائرة: '+num+'</b><br>';
    html+='الباسورد في الدرايف: <b style="color:blue;direction:ltr;display:inline-block">'+(cloudPass?cloudPass:'(فاضي)')+'</b><br>';
    html+='الباسورد لوكال على الجهاز ده: <b>'+localPass+'</b><br>';
    html+='اللي انت كتبته: <b>'+tryPass+'</b><br><br>';
    
    if(!cloudPass){
      html+='⚠️ الدرايف مفيهوش باسورد - أي باسورد هيدخلك وهيتحفظ<br>';
    } else if(tryPass===cloudPass){
      html+='✅ الباسورد اللي كتبته مطابق للدرايف - المفروض يدخل<br>';
    } else if(tryPass){
      html+='❌ الباسورد اللي كتبته <b>غير مطابق</b> للدرايف<br>';
      html+='الصح هو: <b style="color:green">'+cloudPass+'</b><br>';
      html+='جرب تكتب الصح ده على الموبايل<br>';
    }
    
    html+='<br><small>عدد القضايا في الدرايف: '+(j.v3?j.v3.length:0)+'</small>';
    resDiv.innerHTML=html;
    
    if(tryPass && tryPass.length>=4){
      document.getElementById('fixBtn').style.display='block';
    }
  }catch(e){
    resDiv.innerHTML='❌ فشل: '+e.message;
  }
}
async function fixPass(){
  const num=document.getElementById('dairaNum').value.trim()||'32';
  const tryPass=document.getElementById('tryPass').value;
  if(!tryPass||tryPass.length<4){ alert('اكتب باسورد 4 حروف على الأقل'); return; }
  if(!confirm('هتحدث باسورد الدرايف لدائرة '+num+' ليصبح: '+tryPass+'\nمتأكد؟')) return;
  try{
    // هات البيانات الحالية أولا
    let r=await fetch(CLOUD+'?action=get&daira='+num,{cache:'no-store'});
    let t=await r.text(); let j={}; try{ j=JSON.parse(t);}catch(e){ j={v3:[],ahkam:[]}; }
    let payload={v3:j.v3||[],ahkam:j.ahkam||[],dairaInfo:j.dairaInfo||j.dairaConfig||{},_password:tryPass,_updatedAt:Date.now()};
    let r2=await fetch(CLOUD+'?daira='+num,{method:'POST',body:JSON.stringify(payload)});
    alert('✅ تم تحديث الباسورد في الدرايف - جرب تدخل بيه على الموبايل دلوقتي');
    localStorage.setItem('daira_pass_'+num,tryPass);
    localStorage.setItem('current_daira_pass',tryPass);
    localStorage.setItem('current_daira',num);
  }catch(e){ alert('❌ فشل التحديث: '+e.message); }
}
</script>
</body>
</html>
